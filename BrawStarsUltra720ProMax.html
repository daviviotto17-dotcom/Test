        this.slowHealActive = false; // Se está com cura lenta ativa
        this.eighbitGadgetActive = false; // Gadget do 8-bit está ativo
        this.eighbitDucksToParalyze = 0; // Quantos patos devem ter paralisia
    }
    update(){
        if(this.dead)return;
        if(this.markedTimer > 0) this.markedTimer--;
        if(this.immuneTimer > 0) this.immuneTimer--;
        if(this.botSuperCooldown > 0) this.botSuperCooldown--;
        if(this.attackingTimer > 0) this.attackingTimer--;
        if(this.punchCooldown > 0) this.punchCooldown--;
        if(this.dashCooldown > 0) this.dashCooldown--;
        if(this.speedBoostTimer > 0) this.speedBoostTimer--;
        if(this.gadgetCooldown > 0) this.gadgetCooldown--;
        
        if(this.damageReductionTimer > 0) {
            this.damageReductionTimer--;
            if(this.damageReductionTimer <= 0) this.damageReduction = 0;
        }
        
        // Gerenciar veneno da Juju
        if(this.poisonTimer > 0) {
            this.poisonTimer--;
            if(this.poisonTimer % 60 === 0) { // A cada 1 segundo
                this.takeDamage(this.poisonDamage, null);
                particles.push(new Particle(this.x, this.y - 60, "VENENO", "#76ff03"));
            }
        }
        
        // Gerenciar lentidão
        if(this.slowness > 0) {
            this.slowness -= 0.01;
            if(this.slowness < 0) this.slowness = 0;
        }
        
        // Gerenciar cura lenta (patos do 8-bit) - SÓ CONTA QUANDO CURANDO
        if(this.slowHealTimer > 0 && this.slowHealActive) {
            // Só diminui timer se está curando (regenTimer > 120)
            if(this.regenTimer > 120 && !this.dead) {
                this.slowHealTimer--;
                // Curar 300 HP por segundo (5 HP por frame a 60fps)
                this.hp = Math.min(this.maxHp, this.hp + 5);
            }
            
            if(this.slowHealTimer <= 0) {
                this.slowHealActive = false;
            }
        }
        
        // Gerenciar bloqueio de super
        if(!this.canUseSuper) {
            // Será gerenciado pela aura
        }
        
        // Decaimento do escudo do Edgar
        if(this.shieldHP > 0) {
            this.shieldHP = Math.max(0, this.shieldHP - this.shieldDecay);
            if(this.shieldHP <= 0) this.maxHp -= 3330;
        }
        
        if(this.stunTimer > 0) {
            this.stunTimer--;
            // Quando paralisado, não faz nada
            if(this.revealed){this.revealTimer--;if(this.revealTimer<=0)this.revealed=false}
            return;
        }
        
        if(this.type === 'edgar') {
            this.edgarSuperRechargeTimer++;
            if(this.edgarSuperRechargeTimer >= 180) {
                this.superCharge = Math.min(100, this.superCharge + 10);
                this.edgarSuperRechargeTimer = 0;
            }
        }

        if(this.bulldozerFrames > 0) {
            this.bulldozerFrames--;
            let nextX = this.x + this.bulldozerVX;
            let nextY = this.y + this.bulldozerVY;
            
            if(!checkWall(nextX, this.y)) this.x = nextX;
            else this.bulldozerFrames = 0;
            
            if(!checkWall(this.x, nextY)) this.y = nextY;
            else this.bulldozerFrames = 0;
            
            for(let i=walls.length-1; i>=0; i--) {
                let w = walls[i]; 
                if(!w.isBorder && dist(this.x, this.y, w.x+TILE/2, w.y+TILE/2) < 100) {
                    walls.splice(i, 1);
                }
            }
            
            entities.forEach(e => {
                if(e !== this && !e.dead && dist(this.x, this.y, e.x, e.y) < 70) {
                    e.takeDamage(this.dmg * 0.8, this, false); // giveSuper=false
                }
            });
            
            // Destruir torretas
            turrets.forEach(t => {
                if(t.owner !== this && dist(this.x, this.y, t.x, t.y) < 100) {
                    if(t.takeDamage) {
                        t.takeDamage(9999);
                    } else {
                        t.dead = true; // Torreta explosiva
                    }
                }
            });
            
            return;
        }
        
        if(this.dashFrames > 0) {
            this.dashFrames--;
            let nextX = this.x + this.dashVX;
            let nextY = this.y + this.dashVY;
            
            if(!checkWall(nextX, this.y)) this.x = nextX;
            if(!checkWall(this.x, nextY)) this.y = nextY;
            
            entities.forEach(e => {
                if(e !== this && !e.dead && dist(this.x, this.y, e.x, e.y) < 70) { 
                    e.takeDamage(this.dashDmg, this);
                }
            });
            
            // Edgar também destrói torretas
            turrets.forEach(t => {
                if(t.owner !== this && dist(this.x, this.y, t.x, t.y) < 100) {
                    if(t.takeDamage) {
                        t.takeDamage(9999);
                    } else {
                        t.dead = true; // Torreta explosiva
                    }
                }
            });
            boxes.forEach(b => {
                if(!b.dead && dist(this.x, this.y, b.x, b.y) < 80) { 
                    b.hp -= this.dashDmg; 
                    if(b.hp <= 0) { b.dead = true; drops.push({x:b.x,y:b.y}); } 
                }
            });
            return; 
        }

        let currentReload = this.reloadTime;
        
        if(this.ammo<3 && this.attackingTimer <= 0){this.reloadTimer++; if(this.reloadTimer > Math.max(20, currentReload-this.power*2)){this.ammo++;this.reloadTimer=0}}
        if(this.revealed){this.revealTimer--;if(this.revealTimer<=0)this.revealed=false}
        this.regenTimer++;
        if(this.regenTimer > 120) { this.hp = Math.min(this.maxHp, this.hp + (this.inBush ? 100 : 60)); }
        
        let mx=0,my=0;
        if(this.isPlayer){
            let currentSpeed = this.speedBoostTimer > 0 ? this.speed * 1.5 : this.speed;
            currentSpeed *= (1 - this.slowness); // Aplicar lentidão
            if(joyMove.active){mx=joyMove.x*currentSpeed;my=joyMove.y*currentSpeed}
            if(joySuper.active && this.superCharge >= 100) this.angle = Math.atan2(joySuper.y, joySuper.x);
            else if(joyShoot.active) this.angle = Math.atan2(joyShoot.y, joyShoot.x);
            else if(joyMove.active) this.angle = Math.atan2(my,mx);
            const btnSuper = document.getElementById('j-super'); const notify = document.getElementById('super-notify');
            if(this.superCharge >= 100) { btnSuper.classList.add('super-ready'); notify.style.display = 'block'; } else { btnSuper.classList.remove('super-ready'); notify.style.display = 'none'; }
        } else { this.runAI(); mx=Math.cos(this.moveDir)*this.aiSpeed*(1-this.slowness); my=Math.sin(this.moveDir)*this.aiSpeed*(1-this.slowness); }
        if(!checkWall(this.x+mx,this.y))this.x+=mx;if(!checkWall(this.x,this.y+my))this.y+=my;
        this.inBush=false;for(let b of bushes)if(this.x>b.x && this.x<b.x+TILE && this.y>b.y && this.y<b.y+TILE){this.inBush=true;break}
        for(let i=drops.length-1;i>=0;i--)if(dist(this.x,this.y,drops[i].x,drops[i].y)<60){this.power++;this.hp=Math.min(this.hp+400,this.maxHp+400);this.maxHp+=400;drops.splice(i,1);if(this.isPlayer)document.getElementById('ui-power').innerText=this.power}
        if(dist(this.x,this.y,MAP_W/2,MAP_H/2)>gasRadius)this.takeDamage(35,null);
    }
    useGadget() {
        // Shelly - Imunidade, 3 usos, recarrega com 2 supers
        if(this.type === 'shelly') {
            if(this.gadgetsLeft > 0 && this.gadgetCooldown <= 0) {
                this.gadgetsLeft--;
                this.immuneTimer = 60;
                particles.push(new Particle(this.x, this.y, "IMUNE!", "#ffffff"));
                this.updateGadgetUI();
            }
        }
        
        // Edgar - 1 uso, 20s cooldown, escudo 3330 HP + velocidade
        else if(this.type === 'edgar') {
            if(this.gadgetCooldown <= 0) {
                this.shieldHP = 3330;
                this.maxHp += 3330;
                this.hp += 3330;
                this.shieldDecay = 3330 / (60 * 10); // Dura 10 segundos
                this.speedBoostTimer = 300; // 5 segundos de velocidade
                this.gadgetCooldown = 1200; // 20 segundos
                particles.push(new Particle(this.x, this.y, "ESCUDO!", "#00e5ff"));
                particles.push(new Particle(this.x, this.y - 50, "VELOCIDADE!", "#ffca28"));
            }
        }
        
        // Colt - 1 uso, 20s cooldown, próximo tiro +1300 dano
        else if(this.type === 'piper') {
            if(this.gadgetCooldown <= 0) {
                this.coltBuffedShot = true;
                this.gadgetCooldown = 1200; // 20 segundos
                particles.push(new Particle(this.x, this.y, "SUPER TIRO!", "#4dd0e1"));
            }
        }
        
        // Bull - 1 uso, 15s cooldown, próximo ataque paralisa
        else if(this.type === 'bull') {
            if(this.gadgetCooldown <= 0) {
                this.bullNextStun = true;
                this.gadgetCooldown = 900; // 15 segundos
                particles.push(new Particle(this.x, this.y, "STUN ATIVO!", "#ffb74d"));
            }
        }
        
        // 8-BIT - Paralisa patos existentes ou marca próximos
        else if(this.type === '8bit') {
            if(this.gadgetCooldown <= 0) {
                // Contar patinhos do jogador
                let myDucks = ducks.filter(d => d.owner === this && !d.dead);
                
                if(myDucks.length > 0) {
                    // Fazer patos existentes paralisarem ao bater
                    myDucks.forEach(duck => {
                        duck.paralyzeOnHit = true;
                    });
                    particles.push(new Particle(this.x, this.y, `${myDucks.length} PATOS BUFFADOS!`, "#7e57c2"));
                } else {
                    // Marcar que próximos 3 patos terão paralisia
                    this.eighbitDucksToParalyze = 3;
                    this.eighbitGadgetActive = true;
                    particles.push(new Particle(this.x, this.y, "PRÓXIMOS PATOS PARALISAM!", "#7e57c2"));
                }
                
                this.gadgetCooldown = 1200; // 20 segundos
            }
        }
        
        // Juju - 17s cooldown, buff no próximo ataque + efeito na super
        else if(this.type === 'juju') {
            if(this.gadgetCooldown <= 0) {
                this.jujuBuffed = true;
                this.gadgetCooldown = 1020; // 17 segundos
                particles.push(new Particle(this.x, this.y, "BUFF!", "#76ff03"));
                
                // Se tiver super ativa no mapa, aplicar efeito extra
                if(this.hasActiveSuperAura) {
                    // Encontrar inimigos dentro da super e aplicar stun + veneno extra
                    for(let b of bullets) {
                        if(b.isJujuAura && b.owner === this) {
                            for(let e of entities) {
                                if(e !== this && !e.dead && dist(b.x, b.y, e.x, e.y) < 250) {
                                    e.stunTimer = 60; // 1 segundo de paralisia
                                    e.poisonTimer += 120; // +2 segundos de veneno
                                    particles.push(new Particle(e.x, e.y - 80, "STUN +VENENO!", "#76ff03"));
                                }
                            }
                            break;
                        }
                    }
                }
            }
        }
    }
    
    updateGadgetUI() {
        if(!this.isPlayer) return;
        let btn = document.getElementById('btn-gadget');
        if(this.type === 'shelly') {
            btn.innerText = this.gadgetsLeft > 0 ? `⚙️${this.gadgetsLeft}` : "❌";
            if(this.gadgetsLeft <= 0) btn.classList.add('disabled');
            else btn.classList.remove('disabled');
        } else {
            if(this.gadgetCooldown > 0) {
                btn.innerText = Math.ceil(this.gadgetCooldown / 60) + "s";
                btn.classList.add('disabled');
            } else {
                btn.innerText = "⚙️";
                btn.classList.remove('disabled');
            }
        }
    }
    runAI(){
        this.decisionTimer--;
        this.botAttackTimer--;
        let distCenter = dist(this.x, this.y, MAP_W/2, MAP_H/2);
        if(distCenter > gasRadius - 200) { this.moveDir = Math.atan2((MAP_H/2) - this.y, (MAP_W/2) - this.x); this.aiSpeed = this.speed; return; }
        
        const canSee=(e)=>{
            if(!e||e.dead)return false;
            let d=dist(this.x,this.y,e.x,e.y);
            if(e.inBush&&!e.revealed&&d>200)return false;
            return hasLOS(this.x,this.y,e.x,e.y);
        };
        
        const canAttackThroughWall = (this.type === 'juju' || (this.type === 'bull' && this.superCharge >= 100) || (this.type === 'shelly' && this.superCharge >= 100));
        
        // Procurar alvo, mesmo atrás de parede se puder atacar através dela
        if(!this.target||this.target.dead||(canAttackThroughWall ? false : !canSee(this.target))) {
            this.target = entities.find(e => e !== this && !e.dead && (canAttackThroughWall || canSee(e)));
        }
        
        // Procurar powercube mais próxima se não tiver alvo
        let closestDrop = null;
        let closestDropDist = Infinity;
        if(!this.target) {
            for(let d of drops) {
                let dd = dist(this.x, this.y, d.x, d.y);
                if(dd < closestDropDist && dd < 400) {
                    closestDropDist = dd;
                    closestDrop = d;
                }
            }
        }
        
        // Procurar caixa ou torreta explosiva mais próxima
        let closestBox = null;
        let closestBoxDist = Infinity;
        if(!this.target && !closestDrop) {
            // Procurar caixas
            for(let b of boxes) {
                if(!b.dead) {
                    let bd = dist(this.x, this.y, b.x, b.y);
                    if(bd < closestBoxDist && bd < 500) {
                        closestBoxDist = bd;
                        closestBox = b;
                    }
                }
            }
            
            // Procurar torretas explosivas (prioridade!)
            for(let t of turrets) {
                if(t.isExplosive && t.owner !== this) {
                    let td = dist(this.x, this.y, t.x, t.y);
                    if(td < closestBoxDist && td < 600) {
                        closestBoxDist = td;
                        closestBox = t; // Tratar como "caixa" para destruir
                    }
                }
            }
        }
        
        if(this.target){
            let dAlvo=dist(this.x,this.y,this.target.x,this.target.y);
            let a=Math.atan2(this.target.y-this.y,this.target.x-this.x);
            let hasLOSToTarget = hasLOS(this.x, this.y, this.target.x, this.target.y);
            
            // Usar gadget se disponível e perto do inimigo
            if(this.gadgetCooldown <= 0 && dAlvo < 300) {
                this.useGadget();
            }
            
            if(this.type === 'edgar') {
                // Edgar persegue mas não cola tanto
                if(dAlvo > 400 && this.superCharge >= 100 && this.botSuperCooldown <= 0) { 
                    this.shoot(true, 1); 
                    this.botSuperCooldown = 240; // Cooldown maior
                }
                
                // Manter distância mais segura
                if(dAlvo < 60) {
                    this.moveDir = a + Math.PI; // Recuar se muito perto
                    this.aiSpeed = this.speed;
                } else if(dAlvo > 100) {
                    this.moveDir = a; // Aproximar se longe
                    this.aiSpeed = this.speed;
                } else {
                    this.aiSpeed = 0; // Parar na distância ideal
                }
                
                this.angle = a;
                // Atacar com menos frequência
                if(this.ammo>0 && this.punchCooldown <= 0 && dAlvo < 90 && Math.random() < 0.7) { 
                    this.shoot(false, 1); 
                }
            } else if(this.type === 'juju') {
                // Juju pode atacar através de paredes
                if(!hasLOSToTarget && dAlvo > 300) {
                    this.moveDir = a;
                    this.aiSpeed = this.speed;
                } else if(dAlvo < 400) {
                    this.moveDir = a + Math.PI;
                    this.aiSpeed = this.speed;
                } else {
                    this.aiSpeed = 0;
                }
                this.angle = a;
                if(this.ammo>0 && this.botAttackTimer <= 0 && dAlvo < 700) {
                    this.shoot(false, Math.min(1, dAlvo/650));
                    this.botAttackTimer = 70;
                }
                if(this.superCharge>=100 && this.botSuperCooldown <= 0 && !this.hasActiveSuperAura) { 
                    this.shoot(true, 1.0); 
                    this.botSuperCooldown = 300; 
                }
            } else if(this.type === 'bull' || this.type === 'shelly') {
                // Bull e Shelly podem usar super através de paredes
                if(!hasLOSToTarget) {
                    if(this.superCharge >= 100 && dAlvo < 500) {
                        this.angle = a;
                        this.shoot(true, 1.0);
                        this.botSuperCooldown = 300;
                    } else {
                        this.moveDir = a;
                        this.aiSpeed = this.speed;
                    }
                } else {
                    if(dAlvo<300){this.moveDir=a+Math.PI;this.aiSpeed=this.speed} 
                    else if(dAlvo>450){this.moveDir=a;this.aiSpeed=this.speed} 
                    else {this.aiSpeed=0}
                    this.angle = a;
                    if(this.ammo>0 && this.botAttackTimer <= 0) { 
                        this.shoot(false, 1); 
                        this.botAttackTimer = 60; 
                    }
                    if(this.superCharge>=100 && this.botSuperCooldown <= 0 && dAlvo < 400) { 
                        this.shoot(true, 1.0); 
                        this.botSuperCooldown = 300; 
                    }
                }
            } else {
                if(dAlvo<300){this.moveDir=a+Math.PI;this.aiSpeed=this.speed} 
                else if(dAlvo>450){this.moveDir=a;this.aiSpeed=this.speed} 
                else {this.aiSpeed=0}
                this.angle = a;
                let attackChance = (this.type === '8bit') ? 0.04 : 0.1;
                if(this.ammo>0 && this.botAttackTimer <= 0 && Math.random()<attackChance) { 
                    this.shoot(false, Math.min(1, dAlvo/650)); 
                    this.botAttackTimer = (this.type === '8bit') ? 120 : 60; 
                }
                if(this.superCharge>=100 && this.botSuperCooldown <= 0) { 
                    this.shoot(true, 1.0); 
                    this.botSuperCooldown = 300; 
                }
            }
        } else if(closestDrop) {
            // Ir pegar powercube
            this.moveDir = Math.atan2(closestDrop.y - this.y, closestDrop.x - this.x);
            this.aiSpeed = this.speed;
            this.angle = this.moveDir;
        } else if(closestBox) {
            // Ir quebrar caixa
            this.moveDir = Math.atan2(closestBox.y - this.y, closestBox.x - this.x);
            this.aiSpeed = this.speed;
            this.angle = this.moveDir;
            if(this.ammo > 0 && this.botAttackTimer <= 0 && closestBoxDist < 200) {
                this.shoot(false, 1);
                this.botAttackTimer = 60;
            }
        } else { 
            // Patrulhar
            if(this.decisionTimer<=0){
                this.decisionTimer=120;
                this.moveDir=Math.random()*Math.PI*2;
            } 
            this.aiSpeed=this.speed*0.5; 
            this.angle = this.moveDir; 
        }
    }
    shoot(isSuper, joyPowerInput = 1.0){
        if(isSuper) { 
            if(this.superCharge < 100 || !this.canUseSuper) return; // Bloqueado pela Juju
            this.superCharge = 0;

            if(this.type === 'edgar') {
                let tx = this.x + Math.cos(this.angle) * (250 * joyPowerInput);
                let ty = this.y + Math.sin(this.angle) * (250 * joyPowerInput);
                if(!checkWall(tx, ty)) { this.x = tx; this.y = ty; }
                
                // Paralisia em área
                particles.push(new Particle(this.x, this.y, "STUN!", "#ffeb3b"));
                for(let e of entities) {
                    if(e !== this && !e.dead && dist(this.x, this.y, e.x, e.y) < 200) {
                        e.stunTimer = 84; // 1.4 segundos (60fps * 1.4)
                        particles.push(new Particle(e.x, e.y - 50, "PARALIZADO!", "#ff5252"));
                    }
                }
                
                // Escudo de 1000 HP
                this.hp = Math.min(this.maxHp + 1000, this.hp + 1000);
                this.maxHp += 1000;
                particles.push(new Particle(this.x, this.y - 70, "+1000 ESCUDO", "#00e5ff"));
                
                // Buff de velocidade por 5 segundos
                this.speedBoostTimer = 300; // 5 segundos (60fps * 5)
                particles.push(new Particle(this.x, this.y - 90, "VELOCIDADE!", "#ffca28"));
                
                return;
            }

            if(this.type === 'juju') {
                if(this.hasActiveSuperAura) return; // Não pode usar super se já tem uma ativa
                
                this.hasActiveSuperAura = true;
                entities.forEach(e => { if(e !== this) e.markedTimer = 60; });
                
                let aura = new Bullet(
                    this.x + Math.cos(this.angle)*(650*joyPowerInput), 
                    this.y + Math.sin(this.angle)*(650*joyPowerInput), 
                    0, 0, 360, // 6 segundos de duração (60fps * 6)
                    100, // 100 de dano por tick
                    this, false, false, false, true
                );
                aura.isJujuAura = true;
                bullets.push(aura);
                
                // Após a super acabar, liberar para ganhar super novamente
                setTimeout(() => { this.hasActiveSuperAura = false; }, 6000);
                
                return;
            }

            if(this.type === 'bull') {
                let maxDist = 750 * joyPowerInput;
                let speed = 25;
                this.bulldozerFrames = Math.floor(maxDist / speed);
                this.bulldozerVX = Math.cos(this.angle) * speed;
                this.bulldozerVY = Math.sin(this.angle) * speed;
                return;
            }

            if(this.type === 'shelly') { 
                let sA = this.angle - 0.2; 
                let totalDmg = this.dmg * (1 + this.power * 0.1);
                for(let i=0; i<5; i++) bullets.push(new Bullet(this.x, this.y, sA + (i*0.1), 20, 60, totalDmg*1.5, this, true, false, false, false, 0, false)); // giveSuper=false
                return; 
            }

            if(this.type === '8bit'){ 
                // Criar torreta explosiva (3000 HP, explode em 3s, solta 3 patos)
                let explosiveTurret = {
                    x: this.x,
                    y: this.y,
                    owner: this,
                    hp: 3000,
                    maxHp: 3000,
                    timer: 180, // 3 segundos
                    dead: false,
                    size: 60,
                    isExplosive: true
                };
                turrets.push(explosiveTurret);
                particles.push(new Particle(this.x, this.y, "TORRETA EXPLOSIVA!", "#7e57c2"));
                return; 
            }
        } else { 
            if(this.ammo <= 0) return; 
            this.ammo--;
            this.attackingTimer = 30;
        }
        
        this.regenTimer=0; 
        if(this.inBush){this.revealed=true;this.revealTimer=120}
        let totalDmg = this.dmg*(1+this.power*0.1); 
        
        if(this.type === 'mortis') {
            if(this.dashCooldown > 0) return;
            this.dashCooldown = 15; // Reduzir cooldown
            this.dashFrames = 12; // Dash mais longo
            this.dashVX = Math.cos(this.angle) * 35; // Velocidade ajustada
            this.dashVY = Math.sin(this.angle) * 35;
            this.dashDmg = totalDmg / 3; // Mais dano por frame
            return;
        }

        if(this.type === 'edgar') {
            if(this.punchCooldown > 0) return;
            this.punchCooldown = 10; // Reduzir cooldown para socar mais rápido
            
            punchEffects.push(new PunchEffect(this.x, this.y, this.angle));
            
            let hitSomeone = false;
            let punchRange = 80; // Alcance reduzido para não grudar
            
            let hitEnemies = false;
            let hitBoxes = false;
            
            // Acertar inimigos
            entities.forEach(e => {
                if(e !== this && !e.dead && dist(this.x, this.y, e.x, e.y) < punchRange) {
                    let angleToEnemy = Math.atan2(e.y - this.y, e.x - this.x);
                    let angleDiff = Math.abs(angleToEnemy - this.angle);
                    if(angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                    
                    if(angleDiff < 0.7) { // Ângulo de ataque mais restrito
                        e.takeDamage(totalDmg, this);
                        hitEnemies = true;
                        particles.push(new Particle(e.x, e.y - 50, "POW!", "#ff5252"));
                    }
                }
            });
            
            // Curar ao acertar inimigos
            if(hitEnemies) {
                this.hp = Math.min(this.maxHp, this.hp + 200);
                particles.push(new Particle(this.x, this.y, "+200 HP", "#00ff00"));
            }
            
            // Acertar caixas (sem curar)
            boxes.forEach(b => {
                if(!b.dead && dist(this.x, this.y, b.x, b.y) < punchRange) {
                    let angleToBox = Math.atan2(b.y - this.y, b.x - this.x);
                    let angleDiff = Math.abs(angleToBox - this.angle);
                    if(angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                    
                    if(angleDiff < 0.7) {
                        b.hp -= totalDmg;
                        if(b.hp <= 0) {
                            b.dead = true;
                            drops.push({x: b.x, y: b.y});
                        }
                        hitBoxes = true;
                        particles.push(new Particle(b.x, b.y - 50, "BOOM!", "#ffeb3b"));
                    }
                }
            });
            
            return;
        }

        if(this.type === '8bit'){ 
            let shootAngle = this.angle;
            let s = 0;
            let it = setInterval(() => {
                if(this.dead || s >= 6) { clearInterval(it); return; }
                bullets.push(new Bullet(this.x, this.y, shootAngle + (Math.random()-0.5)*0.05, 25, this.rangeMult, totalDmg, this));
                s++;
            }, 150);
            return; 
        }

        let count = this.bullets; let sA=this.angle-(this.spread/2), step=count>1?this.spread/(count-1):0;
        for(let i=0;i<count;i++) {
            let stunDur = 0;
            let extraDmg = 0;
            
            if(this.type === 'bull' && this.bullNextStun) {
                stunDur = 90; // 1.5 segundos
                if(i === 0) this.bullNextStun = false;
            }
            
            if(this.type === 'piper' && this.coltBuffedShot) {
                extraDmg = 1300;
                if(i === 0) {
                    this.coltBuffedShot = false;
                    particles.push(new Particle(this.x, this.y, "SUPER TIRO!", "#4dd0e1"));
                }
            }
            
            if(this.isLobber) {
                let dmgMult = (this.type === 'juju' && this.jujuBuffed) ? 1.3 : 1;
                let rangeMult = (this.type === 'juju' && this.jujuBuffed) ? 1.5 : 1;
                let wallBuster = (this.type === 'juju' && this.jujuBuffed);
                bullets.push(new Bullet(this.x, this.y, sA+(step*i), 15, Math.max(10, Math.floor(43 * joyPowerInput * rangeMult)), (totalDmg + extraDmg) * dmgMult, this, wallBuster, true, false, false, stunDur));
                if(this.jujuBuffed) this.jujuBuffed = false;
            }
            else bullets.push(new Bullet(this.x,this.y,sA+(step*i),25,this.rangeMult,totalDmg + extraDmg,this,false,false,false,false,stunDur));
        }
    }
    takeDamage(d, attacker, giveSuper = true){
        if(this.immuneTimer > 0) return;
        
        // Aplicar redução de dano do 8-BIT
        if(this.damageReduction > 0) {
            let originalDamage = d;
            d *= (1 - this.damageReduction);
            particles.push(new Particle(this.x, this.y - 70, `-${Math.floor(originalDamage - d)}`, "#7e57c2"));
        }
        
        // Proteger com escudo do Edgar
        if(this.shieldHP > 0) {
            let dmgToShield = Math.min(d, this.shieldHP);
            this.shieldHP -= dmgToShield;
            d -= dmgToShield;
            if(this.shieldHP <= 0) this.maxHp -= 3330;
            if(d <= 0) {
                particles.push(new Particle(this.x,this.y-50,"BLOQUEADO!","#00e5ff"));
                return;
            }
        }
        
        this.hp-=d; this.regenTimer=0; if(!this.dead) particles.push(new Particle(this.x,this.y-50,Math.floor(d),"#ff1744"));
        
        // Dar carga de super APENAS se giveSuper for true
        if(attacker && giveSuper) { 
            let oldCharge = attacker.superCharge;
            let charge = (attacker.type === 'edgar') ? 12 : 16;
            
            // 8-BIT carrega 30% mais devagar
            if(attacker.type === '8bit') {
                charge *= 0.7;
            }
            
            attacker.superCharge = Math.min(100, attacker.superCharge + charge);
            
            // Shelly - recarregar gadgets ao carregar 2 supers
            if(attacker.type === 'shelly' && oldCharge < 100 && attacker.superCharge >= 100) {
                attacker.supersForGadget++;
                if(attacker.supersForGadget >= 2) {
                    attacker.gadgetsLeft = 3;
                    attacker.supersForGadget = 0;
                    particles.push(new Particle(attacker.x, attacker.y - 80, "GADGETS!", "#f06292"));
                    if(attacker.isPlayer) attacker.updateGadgetUI();
                }
            }
            
            if(!this.isPlayer){ this.target=attacker; this.botAttackTimer=20; } 
        }
        if(this.hp<=0) this.die();
    }
    die(){
        if(this.dead)return; this.dead=true; survivors--; document.getElementById('ui-alive').innerText=survivors;
        for(let i=0;i<Math.max(1, Math.min(this.power, 3));i++) drops.push({x:this.x+(Math.random()-0.5)*80,y:this.y+(Math.random()-0.5)*80});
        if(this.isPlayer) setTimeout(()=>endGame(false),1500); else if(survivors===1&&!player.dead) endGame(true);
    }
    draw(){
        if(this.dead)return; 
        if(this.inBush&&!this.isPlayer&&!this.revealed&&dist(this.x,this.y,player.x,player.y)>220 && this.markedTimer <= 0) return;
        
        ctx.save(); ctx.translate(this.x,this.y);
        if(this.stunTimer > 0) {
            ctx.beginPath(); ctx.arc(0,0, 70, 0, Math.PI*2); 
            ctx.strokeStyle = "#ff1744"; ctx.lineWidth = 5; ctx.stroke();
            ctx.fillStyle = "rgba(255, 23, 68, 0.4)"; ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "bold 20px Arial"; ctx.textAlign = "center";
            ctx.fillText("⚡STUN⚡", 0, 5);
        }
        if(this.immuneTimer > 0) {
            ctx.beginPath(); ctx.arc(0,0, 60, 0, Math.PI*2); 
            ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 4; ctx.stroke();
            ctx.fillStyle = "rgba(255, 255, 0, 0.3)"; ctx.fill();
        }
        if(this.markedTimer > 0) { ctx.fillStyle = "#ffca28"; ctx.beginPath(); ctx.moveTo(0, -130); ctx.lineTo(-15, -150); ctx.lineTo(15, -150); ctx.fill(); }
        if(this.inBush)ctx.globalAlpha=0.5;
        ctx.fillStyle="#111"; ctx.fillRect(-60,-95,120,15);
        // Verde durante cura lenta, senão cor normal
        let hpColor = this.slowHealActive ? "#00ff00" : (this.isPlayer ? "#00e676" : "#d50000");
        ctx.fillStyle=hpColor; ctx.fillRect(-60,-95,120*(Math.max(0,this.hp)/this.maxHp),15);
        ctx.fillStyle="#fff"; ctx.font="bold 12px Arial"; ctx.textAlign="center"; ctx.fillText(Math.floor(this.hp) + " / " + this.maxHp, 0, -83);
        ctx.fillStyle="#ff9100"; ctx.fillRect(-45,-78,30*this.ammo,5);
        ctx.fillStyle="#ffeb3b"; ctx.fillRect(-45,-71,90*(this.superCharge/100),5);
        if(this.power>0){ctx.fillStyle="#fff";ctx.font="bold 18px Arial";ctx.fillText("⚡"+this.power,-75,-83)}
        ctx.rotate(this.angle); ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(-15,-15,10,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-15,15,10,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=this.baseColor; ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill(); ctx.fillStyle="rgba(0,0,0,0.3)"; ctx.fillRect(-13,-20,26,40);
        ctx.fillStyle="#f5c6a5"; ctx.beginPath(); ctx.arc(15,-12,9,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(25,12,9,0,Math.PI*2); ctx.fill(); 
        ctx.fillStyle="#333"; ctx.fillRect(10,4,60,8); ctx.fillStyle="#5d4037"; ctx.fillRect(10,4,35,8); ctx.fillRect(0,4,10,14); ctx.fillStyle="#000"; ctx.fillRect(40,10,10,14);
        ctx.fillStyle=this.isPlayer?"#1565c0":"#c62828"; ctx.beginPath(); ctx.arc(0,0,19,0,Math.PI*2); ctx.fill(); ctx.restore(); ctx.globalAlpha=1;
    }
}

function hasLOS(x1,y1,x2,y2){ let d=dist(x1,y1,x2,y2), s=Math.ceil(d/40); for(let i=1;i<s;i++){ let tx=x1+(x2-x1)*(i/s), ty=y1+(y2-y1)*(i/s); if(checkWall(tx,ty)) return false; } return true; }
function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2)}
function checkWall(x,y){for(let w of walls)if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h)return true;return false}

function startGame(){
    document.querySelectorAll('.menu-screen').forEach(s=>s.style.display='none');document.getElementById('ui-layer').style.display='block';
    currentMap=MAPS[0]; walls=[]; bushes=[]; boxes=[]; spawns=[]; entities=[]; drops=[]; bullets=[]; particles=[]; punchEffects=[]; turrets=[]; ducks=[]; coltMissiles=[];
    let grid=currentMap.grid; MAP_W=grid[0].length*TILE; MAP_H=grid.length*TILE; gasRadius=MAP_W * 0.8;
    for(let y=0;y<grid.length;y++)for(let x=0;x<grid[0].length;x++){
        let t=grid[y][x],px=x*TILE,py=y*TILE;
        if(t==='W')walls.push({x:px,y:py,w:TILE,h:TILE,isBorder:(x===0 || y===0 || x===grid[0].length-1 || y===grid.length-1)});
        if(t==='M')bushes.push({x:px,y:py,w:TILE,h:TILE});
        if(t==='C')boxes.push({x:px+TILE/2,y:py+TILE/2,hp:5000,dead:false});
        if(t==='S')spawns.push({x:px+TILE/2,y:py+TILE/2});
    }
    spawns.sort(()=>Math.random()-0.5); player=new Brawler(spawns[0].x,spawns[0].y,selectedBrawlerKey,true); entities.push(player);
    let types=['shelly','edgar','piper','bull','8bit','juju']; for(let i=1;i<spawns.length&&i<=9;i++)entities.push(new Brawler(spawns[i].x,spawns[i].y,types[Math.floor(Math.random()*types.length)],false));
    survivors=entities.length; document.getElementById('ui-alive').innerText=survivors; gameActive=true; paused=false; loop();
    document.getElementById('btn-gadget').innerText = "⚙️";
    document.getElementById('btn-gadget').classList.remove('disabled');
}

function togglePause(){if(!gameActive)return;paused=!paused;document.getElementById('pauseMenu').style.display=paused?'flex':'none'}
function endGame(win){gameActive=false;document.getElementById('endScreen').style.display='flex';document.getElementById('endTitle').innerText=win?"VITÓRIA!":"DERROTA";document.getElementById('endSub').innerText=win?"DOMINAÇÃO TOTAL!":"Posição: #"+survivors}

function loop(){
    if(!gameActive)return; requestAnimationFrame(loop); if(paused)return; gasRadius-=0.8;
    
    updateKeyboardControls(); // Atualizar controles de teclado
    
    entities.forEach(e=>e.update()); 
    
    // Atualizar UI do gadget
    if(player && !player.dead) player.updateGadgetUI();
    
    bullets.forEach((b,i)=>{
        b.update();
        if(b.isBat && b.hitSomething && b.owner && !b.owner.dead) {
            b.owner.hp = Math.min(b.owner.maxHp, b.owner.hp + b.healOwner);
            particles.push(new Particle(b.owner.x, b.owner.y - 60, `+${b.healOwner}`, "#00ff00"));
        }
        if(b.life<=0)bullets.splice(i,1)
    }); 
    
    for(let i = turrets.length - 1; i >= 0; i--) {
        let t = turrets[i];
        
        // Torreta explosiva (objeto simples)
        if(t.isExplosive) {
            if(t.dead) {
                turrets.splice(i,1);
                continue;
            }
            
            t.timer--;
            if(t.timer <= 0) {
                // Explodir e soltar 3 patos
                particles.push(new Particle(t.x, t.y, "EXPLOSÃO!", "#ff5252"));
                
                for(let j = 0; j < 3; j++) {
                    let newDuck = new Duck(t.x, t.y, t.owner, null);
                    
                    // Verificar se owner tem gadget ativo (8-bit)
                    if(t.owner && t.owner.eighbitDucksToParalyze > 0) {
                        newDuck.paralyzeOnHit = true;
                        t.owner.eighbitDucksToParalyze--;
                        
                        if(t.owner.eighbitDucksToParalyze <= 0) {
                            t.owner.eighbitGadgetActive = false;
                        }
                    }
                    
                    ducks.push(newDuck);
                }
                particles.push(new Particle(t.x, t.y - 40, "3 PATOS!", "#ffeb3b"));
                t.dead = true;
            }
        } else {
            // Torreta normal (classe Turret)
            if(t.update) t.update();
        }
        
        // Torretas podem receber dano de balas
        for(let b of bullets) {
            if(b.owner !== t.owner && dist(t.x, t.y, b.x, b.y) < 60) {
                if(t.takeDamage) {
                    t.takeDamage(b.dmg);
                } else {
                    // Torreta explosiva (objeto simples)
                    t.hp -= b.dmg;
                    particles.push(new Particle(t.x, t.y - 30, Math.floor(b.dmg), "#ff5252"));
                    if(t.hp <= 0) t.dead = true;
                }
                b.life = 0;
            }
        }
        if(t.dead) turrets.splice(i,1);
    }
    
    for(let i = ducks.length - 1; i >= 0; i--) {
        let d = ducks[i];
        
        // Todos os patos agora são da classe Duck
        if(d.update) d.update();
        
        // Patos podem receber dano de balas
        for(let b of bullets) {
            if(b.owner !== d.owner && dist(d.x, d.y, b.x, b.y) < 30) {
                if(d.takeDamage) {
                    d.takeDamage(b.dmg, b.owner, false); // Não dá super
                }
                b.life = 0;
            }
        }
        if(d.dead) ducks.splice(i,1);
    }
    
    punchEffects.forEach((p,i)=>{p.update();if(p.life<=0)punchEffects.splice(i,1)});
    particles.forEach((p,i)=>{p.update();if(p.life<=0)particles.splice(i,1)});
    cam.x=Math.max(0,Math.min(player.x-cvs.width/2,MAP_W-cvs.width));cam.y=Math.max(0,Math.min(player.y-cvs.height/2,MAP_H-cvs.height));
    ctx.fillStyle="#000";ctx.fillRect(0,0,cvs.width,cvs.height);ctx.save();ctx.translate(-cam.x,-cam.y);
    ctx.fillStyle=currentMap.color;ctx.fillRect(0,0,MAP_W,MAP_H);
    ctx.fillStyle=currentMap.bushColor;bushes.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
    drops.forEach(d=>{ctx.fillStyle="#00e5ff";ctx.fillRect(d.x-15,d.y-15,30,30)});
    boxes.forEach(b=>{if(b.dead)return;ctx.fillStyle="#ffb74d";ctx.fillRect(b.x-45,b.y-45,90,90);ctx.fillStyle="#000";ctx.fillRect(b.x-35,b.y-60,70,8);ctx.fillStyle="#0f0";ctx.fillRect(b.x-35,b.y-60,70*(b.hp/5000),8)});
    turrets.forEach(t=>{
        if(t.isExplosive) {
            // Desenhar torreta explosiva
            ctx.save();
            ctx.translate(t.x, t.y);
            
            // Corpo vermelho piscante
            let flash = Math.floor(t.timer / 10) % 2;
            ctx.fillStyle = flash ? "#ff5252" : "#ff1744";
            ctx.fillRect(-t.size, -t.size * 0.5, t.size * 2, t.size);
            
            // Torre
            ctx.fillStyle = "#d32f2f";
            ctx.fillRect(-t.size * 0.6, -t.size * 1.2, t.size * 1.2, t.size);
            
            // Símbolo de perigo
            ctx.fillStyle = "#ffeb3b";
            ctx.font = "bold 40px Arial";
            ctx.textAlign = "center";
            ctx.fillText("⚠", 0, 10);
            
            // Timer
            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px Arial";
            ctx.fillText(Math.ceil(t.timer / 60), 0, -t.size - 20);
            
            // Barra de HP
            ctx.fillStyle = "#111";
            ctx.fillRect(-t.size, -t.size - 35, t.size * 2, 12);
            ctx.fillStyle = "#ff5252";
            ctx.fillRect(-t.size, -t.size - 35, (t.size * 2) * (t.hp / t.maxHp), 12);
            
            ctx.restore();
        } else {
            t.draw();
        }
    });
    ducks.forEach(d=>{
        if(d.draw) d.draw();
    });
    entities.sort((a,b)=>a.y-b.y).forEach(e=>e.draw()); 
    
    walls.forEach(w=>{ ctx.fillStyle=w.isBorder?"#222":currentMap.wallColor; ctx.fillRect(w.x,w.y,w.w,w.h); if(w.isBorder){ctx.strokeStyle="#444";ctx.lineWidth=4;ctx.strokeRect(w.x,w.y,w.w,w.h)} });
    
    bullets.forEach(b=>b.draw()); 
    punchEffects.forEach(p=>p.draw());
    particles.forEach(p=>p.draw());
    
    if(player && !player.dead) {
        if(joyShoot.active) {
            if(player.type === 'juju') {
                let distJuju = 650 * joyShoot.power;
                let tx = player.x + Math.cos(player.angle) * distJuju;
                let ty = player.y + Math.sin(player.angle) * distJuju;
                
                ctx.fillStyle = "rgba(118, 255, 3, 0.2)";
                ctx.beginPath();
                ctx.arc(tx, ty, 160, 0, Math.PI*2);
                ctx.fill();
                
                ctx.strokeStyle = "#76ff03";
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.strokeStyle = "rgba(118, 255, 3, 0.5)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(tx, ty);
                ctx.stroke();
            } else if(player.type === 'edgar') {
                ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.arc(player.x, player.y, 90, player.angle - 0.8, player.angle + 0.8);
                ctx.closePath();
                ctx.fill();
                
                ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
                ctx.lineWidth = 3;
                ctx.stroke();
            } else if(player.type === '8bit') {
                let maxRange = player.rangeMult * 10;
                ctx.strokeStyle = "rgba(126, 87, 194, 0.4)";
                ctx.lineWidth = 2;
                for(let i = 0; i < 7; i++) {
                    let lineAngle = player.angle + (i - 3) * 0.015;
                    let tx = player.x + Math.cos(lineAngle) * maxRange;
                    let ty = player.y + Math.sin(lineAngle) * maxRange;
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    ctx.lineTo(tx, ty);
                    ctx.stroke();
                }
            } else if(player.type === 'shelly' || player.type === 'bull') {
                let maxRange = player.rangeMult * 10;
                ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.arc(player.x, player.y, maxRange, player.angle - player.spread/2, player.angle + player.spread/2);
                ctx.closePath();
                ctx.fill();
                
                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                ctx.lineWidth = 3;
                ctx.stroke();
            } else if(player.type === 'piper') {
                let maxRange = player.rangeMult * 10;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.x + Math.cos(player.angle) * maxRange, player.y + Math.sin(player.angle) * maxRange);
                ctx.stroke();
            }
        }
        
        if(joySuper.active && player.superCharge >= 100) {
            if(player.type === 'edgar') {
                let dist = 250 * joySuper.power;
                let tx = player.x + Math.cos(player.angle) * dist;
                let ty = player.y + Math.sin(player.angle) * dist;
                
                ctx.fillStyle = "rgba(255, 235, 59, 0.3)";
                ctx.beginPath();
                ctx.arc(tx, ty, 60, 0, Math.PI*2);
                ctx.fill();
                
                ctx.strokeStyle = "#ffeb3b";
                ctx.lineWidth = 3;
                ctx.stroke();
            } else if(player.type === 'juju') {
                let dist = 650 * joySuper.power;
                let tx = player.x + Math.cos(player.angle) * dist;
                let ty = player.y + Math.sin(player.angle) * dist;
                
                ctx.fillStyle = "rgba(255, 235, 59, 0.3)";
                ctx.beginPath();
                ctx.arc(tx, ty, 250, 0, Math.PI*2);
                ctx.fill();
                
                ctx.strokeStyle = "#ffeb3b";
                ctx.lineWidth = 3;
                ctx.stroke();
            } else if(player.type === 'bull') {
                let maxDist = 750 * joySuper.power;
                let tx = player.x + Math.cos(player.angle) * maxDist;
                let ty = player.y + Math.sin(player.angle) * maxDist;
                
                ctx.strokeStyle = "rgba(255, 183, 77, 0.5)";
                ctx.lineWidth = 60;
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(tx, ty);
                ctx.stroke();
                
                ctx.strokeStyle = "#ffb74d";
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }
    }
    
    ctx.strokeStyle="rgba(0,255,0,0.3)";ctx.lineWidth=1500;ctx.beginPath();ctx.arc(MAP_W/2,MAP_H/2,gasRadius+750,0,Math.PI*2);ctx.stroke();ctx.restore();
}

function handleJoy(e,j,isP){
    if(paused)return; e.preventDefault();
    if(!isP){ 
        if(j.active){ 
            if(j.id === 'j-super') player.shoot(true, j.power); 
            else if(j.id === 'j-shoot') player.shoot(false, j.power); 
        } 
        j.active=false;j.x=0;j.y=0;j.power=0;j.justTouched=false;
        j.baseX = 0; j.baseY = 0;
        document.getElementById(j.stick).style.transform=`translate(-50%,-50%)`; 
        
        // Esconder joystick dinâmico
        if(j.id !== 'j-super') {
            document.getElementById(j.id).style.opacity = '0';
        }
        return; 
    }
    
    // Joystick dinâmico - captura primeiro toque para definir base
    let wasJustTouched = !j.active;
    let t = e.targetTouches[0];
    
    if(wasJustTouched) {
        // Primeiro toque - definir posição base do joystick
        j.baseX = t.clientX;
        j.baseY = t.clientY;
        
        // Mostrar e posicionar joystick
        let joyEl = document.getElementById(j.id);
        joyEl.style.left = j.baseX + 'px';
        joyEl.style.top = j.baseY + 'px';
        joyEl.style.opacity = '0.7';
    }
    
    // Calcular offset do toque em relação à base
    let dx = t.clientX - j.baseX;
    let dy = t.clientY - j.baseY;
    let distVal = Math.min(Math.hypot(dx,dy), 70);
    let ang = Math.atan2(dy,dx);
    
    j.active = true;
    j.x = Math.cos(ang);
    j.y = Math.sin(ang);
    j.power = distVal / 70;
    
    // Mover stick visual
    document.getElementById(j.stick).style.transform = `translate(calc(-50% + ${Math.cos(ang)*distVal}px), calc(-50% + ${Math.sin(ang)*distVal}px))`;
    
    // Auto-fire MELHORADO - aceita pequenos movimentos (até 20px)
    if(j.id === 'j-shoot' && wasJustTouched && player) {
        // Dar um pequeno delay para permitir micro-movimentos
        setTimeout(() => {
            if(!j.active) return; // Usuário já soltou
            
            let closestTarget = null;
            let closestDist = Infinity;
            
            // Procura inimigos
            for(let e of entities) {
                if(e !== player && !e.dead) {
                    let d = dist(player.x, player.y, e.x, e.y);
                    if(d < closestDist && d < 600) {
                        closestDist = d;
                        closestTarget = e;
                    }
                }
            }
            
            // Procura caixas se não achou inimigo próximo
            if(!closestTarget) {
                for(let b of boxes) {
                    if(!b.dead) {
                        let d = dist(player.x, player.y, b.x, b.y);
                        if(d < closestDist && d < 600) {
                            closestDist = d;
                            closestTarget = b;
                        }
                    }
                }
            }
            
            if(closestTarget) {
                player.angle = Math.atan2(closestTarget.y - player.y, closestTarget.x - player.x);
            }
        }, 50); // 50ms de tolerância para movimento
    }
}

// Controle de teclado
document.addEventListener('keydown', (e) => {
    if(!gameActive || paused) return;
    let key = e.key.toLowerCase();
    
    if(key === 'w') keys.w = true;
    if(key === 'a') keys.a = true;
    if(key === 's') keys.s = true;
    if(key === 'd') keys.d = true;
    if(key === 'alt') {
        keys.alt = true;
        e.preventDefault();
        if(player && player.superCharge >= 100) {
            player.shoot(true, 1);
        }
    }
    if(key === 'control') {
        keys.ctrl = true;
        e.preventDefault();
        if(player) player.useGadget();
    }
});

document.addEventListener('keyup', (e) => {
    let key = e.key.toLowerCase();
    if(key === 'w') keys.w = false;
    if(key === 'a') keys.a = false;
    if(key === 's') keys.s = false;
    if(key === 'd') keys.d = false;
    if(key === 'alt') keys.alt = false;
    if(key === 'control') keys.ctrl = false;
});

// Atualizar movimento com teclado no loop
function updateKeyboardControls() {
    if(!player || !gameActive || paused) return;
    
    let mx = 0, my = 0;
    if(keys.w) my -= 1;
    if(keys.s) my += 1;
    if(keys.a) mx -= 1;
    if(keys.d) mx += 1;
    
    // Só controlar joyMove se NÃO há touch de movimento ativo
    if(!lastMoveTouch) {
        if(mx !== 0 || my !== 0) {
            // Normalizar diagonal
            let mag = Math.hypot(mx, my);
            joyMove.x = mx / mag;
            joyMove.y = my / mag;
            joyMove.active = true;
        } else {
            // Parar quando nenhuma tecla está pressionada
            joyMove.x = 0;
            joyMove.y = 0;
            joyMove.active = false;
        }
    }
    // Se há touch ativo, não fazer nada - deixar o touch controlar
}

// Touch dinâmico na tela toda
let activeTouches = new Map();

document.addEventListener('touchstart', (e) => {
    if(!gameActive || paused) return;
    
    for(let touch of e.changedTouches) {
        let x = touch.clientX;
        let y = touch.clientY;
        let screenWidth = window.innerWidth;
        
        // Ignorar toques em botões fixos (super, gadget, pause)
        let superBtn = document.getElementById('j-super').getBoundingClientRect();
        let gadgetBtn = document.getElementById('btn-gadget').getBoundingClientRect();
        
        if(x >= superBtn.left && x <= superBtn.right && y >= superBtn.top && y <= superBtn.bottom) continue;
        if(x >= gadgetBtn.left && x <= gadgetBtn.right && y >= gadgetBtn.top && y <= gadgetBtn.bottom) continue;
        
        // Metade esquerda = movimento, metade direita = ataque
        if(x < screenWidth / 2) {
            if(!lastMoveTouch) {
                lastMoveTouch = touch.identifier;
                activeTouches.set(touch.identifier, {type: 'move', startX: x, startY: y});
                joyMove.baseX = x;
                joyMove.baseY = y;
                joyMove.active = true;
                
                let joyEl = document.getElementById('j-move');
                joyEl.style.left = x + 'px';
                joyEl.style.top = y + 'px';
                joyEl.style.opacity = '0.7';
            }
        } else {
            if(!lastShootTouch) {
                lastShootTouch = touch.identifier;
                activeTouches.set(touch.identifier, {type: 'shoot', startX: x, startY: y, autoFireTriggered: false});
                joyShoot.baseX = x;
                joyShoot.baseY = y;
                joyShoot.active = true;
                
                let joyEl = document.getElementById('j-shoot');
                joyEl.style.left = x + 'px';
                joyEl.style.top = y + 'px';
                joyEl.style.opacity = '0.7';
                
                // Auto-fire IMEDIATO (ativa na hora)
                let closestTarget = null;
                let closestDist = Infinity;
                
                for(let e of entities) {
                    if(e !== player && !e.dead) {
                        let d = dist(player.x, player.y, e.x, e.y);
                        if(d < closestDist && d < 600) {
                            closestDist = d;
                            closestTarget = e;
                        }
                    }
                }
                
                if(!closestTarget) {
                    for(let b of boxes) {
                        if(!b.dead) {
                            let d = dist(player.x, player.y, b.x, b.y);
                            if(d < closestDist && d < 600) {
                                closestDist = d;
                                closestTarget = b;
                            }
                        }
                    }
                }
                
                if(closestTarget) {
                    player.angle = Math.atan2(closestTarget.y - player.y, closestTarget.x - player.x);
                    activeTouches.get(touch.identifier).autoFireTriggered = true;
                }
            }
        }
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(!gameActive || paused) return;
    e.preventDefault();
    
    for(let touch of e.changedTouches) {
        let touchData = activeTouches.get(touch.identifier);
        if(!touchData) continue;
        
        let dx = touch.clientX - (touchData.type === 'move' ? joyMove.baseX : joyShoot.baseX);
        let dy = touch.clientY - (touchData.type === 'move' ? joyMove.baseY : joyShoot.baseY);
        let distVal = Math.min(Math.hypot(dx, dy), 70);
        let ang = Math.atan2(dy, dx);
        
        if(touchData.type === 'move') {
            joyMove.x = Math.cos(ang);
            joyMove.y = Math.sin(ang);
            joyMove.power = distVal / 70;
            document.getElementById('stick-move').style.transform = `translate(calc(-50% + ${Math.cos(ang)*distVal}px), calc(-50% + ${Math.sin(ang)*distVal}px))`;
        } else {
            joyShoot.x = Math.cos(ang);
            joyShoot.y = Math.sin(ang);
            joyShoot.power = distVal / 70;
            document.getElementById('stick-shoot').style.transform = `translate(calc(-50% + ${Math.cos(ang)*distVal}px), calc(-50% + ${Math.sin(ang)*distVal}px))`;
        }
    }
}, {passive: false});

document.addEventListener('touchend', (e) => {
    if(!gameActive || paused) return;
    
    for(let touch of e.changedTouches) {
        let touchData = activeTouches.get(touch.identifier);
        if(!touchData) continue;
        
        if(touch.identifier === lastMoveTouch) {
            lastMoveTouch = null;
            joyMove.active = false;
            joyMove.x = 0;
            joyMove.y = 0;
            document.getElementById('stick-move').style.transform = 'translate(-50%, -50%)';
            document.getElementById('j-move').style.opacity = '0';
        }
        
        if(touch.identifier === lastShootTouch) {
            lastShootTouch = null;
            if(joyShoot.active) {
                player.shoot(false, joyShoot.power);
            }
            joyShoot.active = false;
            joyShoot.x = 0;
            joyShoot.y = 0;
            document.getElementById('stick-shoot').style.transform = 'translate(-50%, -50%)';
            document.getElementById('j-shoot').style.opacity = '0';
        }
        
        activeTouches.delete(touch.identifier);
    }
});

[joyMove, joyShoot, joySuper].forEach(j=>{ let el=document.getElementById(j.id); el.addEventListener('touchstart',e=>handleJoy(e,j,true)); el.addEventListener('touchmove',e=>handleJoy(e,j,true)); el.addEventListener('touchend',e=>handleJoy(e,j,false)); });

document.getElementById('btn-gadget').addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    if(player) player.useGadget();
});
document.getElementById('btn-gadget').addEventListener('touchstart', (e) => {
    e.preventDefault(); e.stopPropagation();
    if(player) player.useGadget();
});

initMenu();
</script>

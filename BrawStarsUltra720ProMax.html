<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Elite: Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@700&display=swap');
        body { margin: 0; overflow: hidden; background: #0d0d0d; font-family: 'Roboto', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 5; }
        .hud-top { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; }
        .stat-box { background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 12px; border: 2px solid #555; color: #fff; font-family: 'Black Ops One', cursive; font-size: 28px; text-shadow: 2px 2px 0 #000; display: flex; align-items: center; gap: 10px; }
        .btn-pause { pointer-events: auto; background: #d32f2f; border: 3px solid #fff; width: 50px; height: 50px; border-radius: 50%; color: white; font-size: 22px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #b71c1c; }
        #super-notify { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); font-family: 'Black Ops One'; font-size: 40px; color: #ffeb3b; text-shadow: 0 0 10px #ffc107, 4px 4px 0 #000; display: none; animation: pulse 0.5s infinite alternate; pointer-events: none; }
        @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.2); } }
        .joy-zone { position: absolute; width: 140px; height: 140px; pointer-events: auto; z-index: 100; }
        #j-move { bottom: 40px; left: 40px; } 
        #j-shoot { bottom: 40px; right: 40px; }
        #j-super { bottom: 160px; right: 60px; width: 100px; height: 100px; opacity: 0.5; pointer-events: none; transition: 0.3s; }
        #j-super.super-ready { opacity: 1; pointer-events: auto; filter: drop-shadow(0 0 10px #ffeb3b); }
        .joy-bg { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; }
        .joy-stick { width: 50%; height: 50%; background: rgba(255, 202, 40, 0.9); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #stick-move { background: #00e5ff; } #stick-shoot { background: #ff5252; } #stick-super { background: #ffeb3b; border: 2px solid #fff; }
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 1000; background: #111; color: white; }
        #homeScreen { background: #0f172a; align-items: center; justify-content: center; }
        .home-logo { position: absolute; top: 40px; left: 40px; font-family: 'Black Ops One'; color: #ffca28; font-size: 40px; text-transform: uppercase; }
        .home-char-display { transform: scale(3.5); margin-bottom: 50px; }
        .btn-battle { position: absolute; right: 20px; bottom: 20px; background: #43a047; color: white; font-family: 'Black Ops One'; font-size: 24px; padding: 15px 50px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-agents-home { position: absolute; left: 20px; bottom: 20px; width: 80px; height: 90px; background: #222; border: 2px solid #555; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-family: 'Black Ops One'; font-size: 12px; }
        #selectionScreen { background: linear-gradient(180deg, #1e88e5 0%, #0d47a1 100%); display: none; padding: 20px; box-sizing: border-box; }
        .agents-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px; margin: 0 auto; margin-top: 60px; }
        .agent-card { width: 130px; height: 160px; background: #81d4fa; border: 3px solid #000; border-radius: 8px; position: relative; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        .agent-name-tag { position: absolute; bottom: 35px; width: 100%; text-align: center; font-family: 'Black Ops One'; font-size: 16px; color: white; text-shadow: 2px 2px 0 #000; z-index: 2; }
        .power-level { position: absolute; bottom: 0; left: 0; width: 100%; height: 30px; background: #64dd17; border-top: 2px solid #000; display: flex; align-items: center; justify-content: center; font-family: 'Black Ops One'; font-size: 14px; color: #000; }
        #infoScreen { background: radial-gradient(circle at center, #42a5f5 0%, #1565c0 100%); display: none; }
        .info-content { display: flex; width: 100%; height: 100%; position: relative; }
        .info-left-text { position: absolute; top: 100px; left: 40px; width: 250px; z-index: 2; }
        .info-stats-box { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); width: 280px; background: rgba(0,0,0,0.6); border: 4px solid #000; border-radius: 10px; padding: 15px; }
        .stat-row { margin-bottom: 10px; color: white; font-family: 'Black Ops One'; }
        .btn-select-confirm { position: absolute; bottom: 30px; left: 40px; background: #ffca28; color: #000; font-family: 'Black Ops One'; font-size: 28px; padding: 15px 60px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-back { font-family: 'Black Ops One'; font-size: 30px; color: white; cursor: pointer; background:none; border:none; padding: 10px; position: absolute; top: 20px; left: 20px; z-index: 100; }
        #pauseMenu, #endScreen { display: none; position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        #endScreen h1 { color: #ffca28; font-family: 'Black Ops One'; font-size: 48px; }
        .legacy-btn { padding: 20px 60px; font-size: 28px; font-family: 'Black Ops One'; background: #43a047; border: none; color: white; border-radius: 10px; margin: 10px; }
    </style>
</head>
<body>

<div id="homeScreen" class="menu-screen">
    <div class="home-logo">SURVIVAL.IO<span style="font-size:20px; color:#fff; display:block">Battle Royale</span></div>
    <canvas id="homeCanvas" width="100" height="100" class="home-char-display"></canvas>
    <div class="btn-agents-home" onclick="goToSelection()"><div style="font-size:30px">👥</div>AGENTES</div>
    <button class="btn-battle" onclick="startGame()">BATALHAR</button>
</div>

<div id="selectionScreen" class="menu-screen">
    <button class="btn-back" onclick="goToHome()"> < </button>
    <div class="agents-grid" id="agentsGrid"></div>
</div>

<div id="infoScreen" class="menu-screen">
    <button class="btn-back" onclick="goToSelection()"> < </button>
    <div class="info-content">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(5);"><canvas id="infoCanvas" width="100" height="100"></canvas></div>
        <div class="info-left-text"><h1 id="infoName" style="font-family:'Black Ops One'; font-size:50px; margin:0; text-transform:uppercase;">SHELLY</h1><p id="infoDesc" style="font-size:14px; color:#e3f2fd;"></p></div>
        <div class="info-stats-box">
            <div class="stat-row">SAÚDE <span id="infoHp" style="float:right"></span></div>
            <div class="stat-row">ATAQUE <span id="infoDmg" style="float:right"></span></div>
            <div class="stat-row">SUPER <span id="infoSuper" style="float:right; color:#ffeb3b"></span></div>
        </div>
        <button class="btn-select-confirm" onclick="selectBrawler()">SELECIONAR</button>
    </div>
</div>

<div id="pauseMenu"><h1>PAUSADO</h1><button class="legacy-btn" onclick="togglePause()" style="background:#1976d2">Retornar</button><button class="legacy-btn" onclick="location.reload()" style="background:#d32f2f">Sair</button></div>
<div id="endScreen"><h1 id="endTitle">FIM</h1><h2 id="endSub"></h2><button class="legacy-btn" onclick="location.reload()">Menu</button></div>

<div id="ui-layer">
    <div class="hud-top">
        <div class="stat-box" style="border-color:#00e5ff; color:#00e5ff;">⚡ <span id="ui-power" style="color:white">0</span></div>
        <div id="super-notify">SUPER!</div>
        <div class="btn-pause" onclick="togglePause()">||</div>
        <div class="stat-box" style="border-color:#ff5252; color:#ff5252;">💀 <span id="ui-alive" style="color:white">10</span></div>
    </div>
    <div id="j-move" class="joy-zone"><div class="joy-bg"><div id="stick-move" class="joy-stick"></div></div></div>
    <div id="j-shoot" class="joy-zone"><div class="joy-bg"><div id="stick-shoot" class="joy-stick"></div></div></div>
    <div id="j-super" class="joy-zone"><div class="joy-bg" style="border-color:#ffeb3b"><div id="stick-super" class="joy-stick"></div></div></div>
</div>

<canvas id="cvs"></canvas>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
cvs.width = window.innerWidth;
cvs.height = window.innerHeight;

const BRAWLERS = {
    shelly: { name: "SHELLY", hp: 4000, speed: 6.5, bullets: 5, spread: 0.35, range: 40, reload: 45, dmg: 340, color: "#f06292", desc: "Rajada de chumbo grosso.", superName: "SUPERBALA" },
    shelly2: { name: "SHELLY2", hp: 4000, speed: 6.5, bullets: 5, spread: 0.35, range: 40, reload: 45, dmg: 340, color: "#f06292", desc: "Rajada de chumbo grosso.", superName: "SUPERBALA" },
    colt: { name: "COLT", hp: 3200, speed: 7.5, bullets: 1, spread: 0.02, range: 75, reload: 35, dmg: 820, color: "#4dd0e1", desc: "Atirador de elite.", superName: "TREM-BALA" }, 
    bull: { name: "BULL", hp: 6000, speed: 5.1, bullets: 4, spread: 0.45, range: 17, reload: 67, dmg: 699, color: "#ffb74d", desc: "Tanque agressivo.", superName: "BULLDOZER" },
    '8bit': { name: "8-BIT", hp: 5200, speed: 4.8, bullets: 7, spread: 0.05, range: 90, reload: 89, dmg: 522, color: "#7e57c2", desc: "Poderoso e lento.", superName: "16x DANO" },
    juju: { name: "JUJU", hp: 3800, speed: 6.8, bullets: 1, spread: 0.0, range: 650, reload: 55, dmg: 1400, color: "#76ff03", desc: "Magia de área. Super: Aura do Vazio.", superName: "O VAZIO", isLobber: true }
};

let selectedBrawlerKey = localStorage.getItem('myBrawler') || 'shelly';
let viewingBrawlerKey = selectedBrawlerKey;

function initMenu() { renderMenuChar('homeCanvas', selectedBrawlerKey); buildGrid(); }
function goToHome() { document.querySelectorAll('.menu-screen').forEach(s => s.style.display = 'none'); document.getElementById('homeScreen').style.display = 'flex'; renderMenuChar('homeCanvas', selectedBrawlerKey); }
function goToSelection() { document.querySelectorAll('.menu-screen').forEach(s => s.style.display = 'none'); document.getElementById('selectionScreen').style.display = 'flex'; }
function goToInfo(key) {
    viewingBrawlerKey = key; document.querySelectorAll('.menu-screen').forEach(s => s.style.display = 'none'); document.getElementById('infoScreen').style.display = 'flex';
    const b = BRAWLERS[key]; document.getElementById('infoName').innerText = b.name; document.getElementById('infoDesc').innerText = b.desc; document.getElementById('infoHp').innerText = b.hp;
    document.getElementById('infoDmg').innerText = (b.bullets > 1) ? `${b.bullets} x ${b.dmg}` : b.dmg; document.getElementById('infoSuper').innerText = b.superName;
    renderMenuChar('infoCanvas', key);
}
function selectBrawler() { selectedBrawlerKey = viewingBrawlerKey; localStorage.setItem('myBrawler', selectedBrawlerKey); goToHome(); }

function buildGrid() {
    const grid = document.getElementById('agentsGrid'); grid.innerHTML = '';
    Object.keys(BRAWLERS).forEach(key => {
        const b = BRAWLERS[key]; const card = document.createElement('div'); card.className = 'agent-card'; card.style.background = b.color; card.onclick = () => goToInfo(key);
        const c = document.createElement('canvas'); c.width = 80; c.height = 80;
        const n = document.createElement('div'); n.className = 'agent-name-tag'; n.innerText = b.name;
        const bg = document.createElement('div'); bg.className = 'power-level'; bg.innerHTML = `<span>⚡ 1</span>`;
        card.appendChild(c); card.appendChild(n); card.appendChild(bg); grid.appendChild(card);
        setTimeout(() => renderMenuCharCtx(c.getContext('2d'), key, 40, 40), 10);
    });
}
function renderMenuChar(canvasId, key) { const c = document.getElementById(canvasId); renderMenuCharCtx(c.getContext('2d'), key, c.width/2, c.height/2); }
function renderMenuCharCtx(ctx, key, x, y) {
    const b = BRAWLERS[key]; ctx.clearRect(0,0,200,200); ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(-15, -15, 10, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-15, 15, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(-13, -20, 26, 40);
    ctx.fillStyle = "#f5c6a5"; ctx.beginPath(); ctx.arc(15, -12, 9, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(25, 12, 9, 0, Math.PI*2); ctx.fill(); 
    ctx.fillStyle = "#333"; ctx.fillRect(10, 4, 60, 8); ctx.fillStyle = "#5d4037"; ctx.fillRect(10, 4, 35, 8); ctx.fillRect(0, 4, 10, 14); ctx.fillStyle = "#000"; ctx.fillRect(40, 10, 10, 14);
    ctx.fillStyle = "#1565c0"; ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI*2); ctx.fill(); ctx.restore();
}

const MAPS = [{ color: "#795548", wallColor: "#4e342e", bushColor: "#8d6e63", grid: ["WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW","WS...C...W.......C.......W...C.......SW","W.........W...MMMMMMM...W.............W","W...MM....C...MMMMMMM...C....MM.......W","W...MM.......................MM.......W","W.........WWC..........WW.............W","W...C.....WW......C....WW.............W","W.....................................W","W...C..........WW.WW..........C.......W","W..............W...W..................W","W.....C........W...W..................W","W..............W...W..................W","W...WWWW.......W...W.......WWWW.......W","W...W..........W...W..........W.......W","W...W...C......MMMMM......C...W.......W","W...W............C............W.......W","W...W.........................W.......W","W.............WMMMMMW.................W","W............CWMMMMMW...........C.....W","W.....C.......WMMMMMW.................W","W............CWMMMMMWC................W","W.............WMMMMMW.................W","W...W.........................W.......W","W...W.........................W.......W","W...W...C......MMMMM......C...W.......W","W...W..........W...W..........W.......W","W...WWWW.......W...W.......WWWW.......W","WS............CW.S.WC.................SW","W..............W...W..................W","W..............W...W..................W","W...C..........WW.WW..........C.......W","W.....................................W","W.........WW...........WW.............W","W.........WW...........WW.............W","W...MM....C.............C....MM.......W","W...MM........MMMMMMM........MM.......W","W.........W...MMMMMMM...W.............W","WS...C...W...............W...C.......SW","WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW","WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW"] }];
const TILE = 120;
let walls=[], bushes=[], boxes=[], spawns=[], entities=[], bullets=[], particles=[], drops=[];
let player=null, cam={x:0, y:0}, gameActive=false, paused=false, survivors=0, gasRadius=0, currentMap=null;
const joyMove={x:0, y:0, active:false, id:'j-move', stick:'stick-move'};
const joyShoot={x:0, y:0, active:false, id:'j-shoot', stick:'stick-shoot', power: 0};
const joySuper={x:0, y:0, active:false, id:'j-super', stick:'stick-super', power: 0};

class Particle { constructor(x,y,t,c){this.x=x;this.y=y;this.text=t;this.color=c;this.life=50;this.vy=-2} update(){this.y+=this.vy;this.life--} draw(){ctx.globalAlpha=this.life/50;ctx.fillStyle=this.color;ctx.font="bold 28px 'Black Ops One'";ctx.strokeStyle="black";ctx.lineWidth=4;ctx.strokeText(this.text,this.x,this.y);ctx.fillText(this.text,this.x,this.y);ctx.globalAlpha=1} }

class Bullet {
    constructor(x,y,a,s,l,d,o, wallBuster=false, lobber=false, missile=false, isAura=false){
        this.x=x;this.y=y;this.angle = a; this.speed = s;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.life=l;this.maxLife=l;this.dmg=d;this.owner=o;
        this.wallBuster=wallBuster;this.isLobber=lobber;this.isMissile=missile;
        this.isAura = isAura;
    }
    update(){
        if(this.isAura) {
            this.life--;
            for(let e of entities) {
                if(e !== this.owner && !e.dead && dist(this.x, this.y, e.x, e.y) < 250) {
                    e.takeDamage(this.dmg, this.owner);
                }
            }
            return;
        }
        this.x+=this.vx;this.y+=this.vy;this.life--;
        if(checkWall(this.x,this.y)){ 
            if(this.wallBuster) { this.explode(); this.life = 0; return; }
            if(!this.isLobber) { this.life=0; return; }
        }
        if(this.isLobber) { if(this.life <= 0) { this.explode(); return; } return; }
        for(let b of boxes){if(!b.dead && dist(this.x,this.y,b.x,b.y)<60){b.hp-=this.dmg; if(b.hp <= 0) { b.dead=true; drops.push({x:b.x,y:b.y}); } if(!this.wallBuster) { this.life=0; return; }}}
        for(let e of entities){if(e!==this.owner && !e.dead && dist(this.x,this.y,e.x,e.y)<45){e.takeDamage(this.dmg,this.owner); if(!this.wallBuster) { this.life=0; return; }}}
    }
    explode() {
        particles.push(new Particle(this.x,this.y,"BUM!","#76ff03"));
        if(this.wallBuster) {
            for(let i=walls.length-1; i>=0; i--) {
                let w = walls[i]; if(!w.isBorder && dist(this.x,this.y, w.x+TILE/2, w.y+TILE/2) < 160) walls.splice(i, 1);
            }
        }
        let radius = (this.owner.type === 'juju') ? 160 : 130;
        for(let b of boxes){if(!b.dead && dist(this.x,this.y,b.x,b.y)<radius){b.hp-=this.dmg;if(b.hp<=0){b.dead=true;drops.push({x:b.x,y:b.y})}}}
        for(let e of entities){if(e!==this.owner && !e.dead && dist(this.x,this.y,e.x,e.y)<radius-20) e.takeDamage(this.dmg,this.owner);}
    }
    draw(){ 
        if(this.isAura) {
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.arc(this.x, this.y, 250, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#444"; ctx.lineWidth = 5; ctx.stroke();
            return;
        }
        if(this.isLobber) {
            let progress = 1 - (this.life / this.maxLife);
            let height = Math.sin(progress * Math.PI) * 140;
            ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(this.x, this.y, 14, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#76ff03"; ctx.strokeStyle = "#1b5e20"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(this.x, this.y - height, 16 + (height/7), 0, Math.PI*2); ctx.fill(); ctx.stroke();
        } else {
            ctx.fillStyle=this.wallBuster?"#ffa000":"#ffff00"; ctx.beginPath(); ctx.arc(this.x,this.y,this.wallBuster?15:8,0,Math.PI*2); ctx.fill(); 
        }
    }
}

class Brawler {
    constructor(x,y,t,isP){
        this.x=x;this.y=y;this.isPlayer=isP;this.type=t;const s=BRAWLERS[t];
        this.maxHp=isP?s.hp:Math.floor(s.hp*1.4);this.hp=this.maxHp;this.speed=s.speed;this.dmg=isP?s.dmg:Math.floor(s.dmg*1.2);
        this.reloadTime=s.reload;this.bullets=s.bullets;this.spread=s.spread;this.rangeMult=s.range;this.baseColor=s.color;
        this.angle=0;this.power=0;this.ammo=3;this.reloadTimer=0;this.dead=false;this.inBush=false;this.revealed=false;this.revealTimer=0;this.regenTimer=0;this.target=null;this.decisionTimer=0;this.moveDir=0;this.aiSpeed=0;this.superCharge = 0;
        this.isLobber = s.isLobber || false; this.markedTimer = 0;
    }
    update(){
        if(this.dead)return;
        if(this.markedTimer > 0) this.markedTimer--;
        if(this.ammo<3){this.reloadTimer++;if(this.reloadTimer>Math.max(20,this.reloadTime-this.power*2)){this.ammo++;this.reloadTimer=0}}
        if(this.revealed){this.revealTimer--;if(this.revealTimer<=0)this.revealed=false}
        this.regenTimer++;
        if(this.regenTimer > 120) {
            let heal = this.inBush ? 100 : 60;
            this.hp = Math.min(this.maxHp, this.hp + heal);
        }
        let mx=0,my=0;
        if(this.isPlayer){
            if(joyMove.active){mx=joyMove.x*this.speed;my=joyMove.y*this.speed}
            if(joySuper.active && this.superCharge >= 100) this.angle = Math.atan2(joySuper.y, joySuper.x);
            else if(joyShoot.active) this.angle = Math.atan2(joyShoot.y, joyShoot.x);
            else if(joyMove.active) this.angle = Math.atan2(my,mx);
            const btnSuper = document.getElementById('j-super'); const notify = document.getElementById('super-notify');
            if(this.superCharge >= 100) { btnSuper.classList.add('super-ready'); notify.style.display = 'block'; } else { btnSuper.classList.remove('super-ready'); notify.style.display = 'none'; }
        } else { this.runAI(); mx=Math.cos(this.moveDir)*this.aiSpeed; my=Math.sin(this.moveDir)*this.aiSpeed; }
        if(!checkWall(this.x+mx,this.y))this.x+=mx;if(!checkWall(this.x,this.y+my))this.y+=my;
        this.inBush=false;for(let b of bushes)if(this.x>b.x && this.x<b.x+TILE && this.y>b.y && this.y<b.y+TILE){this.inBush=true;break}
        for(let i=drops.length-1;i>=0;i--)if(dist(this.x,this.y,drops[i].x,drops[i].y)<60){this.power++;this.hp=Math.min(this.hp+400,this.maxHp+400);this.maxHp+=400;drops.splice(i,1);if(this.isPlayer)document.getElementById('ui-power').innerText=this.power}
        if(dist(this.x,this.y,MAP_W/2,MAP_H/2)>gasRadius)this.takeDamage(35,null);
    }
    runAI(){
        this.decisionTimer--;
        let distCenter = dist(this.x, this.y, MAP_W/2, MAP_H/2);
        if(distCenter > gasRadius - 200) { this.moveDir = Math.atan2((MAP_H/2) - this.y, (MAP_W/2) - this.x); this.aiSpeed = this.speed; return; }
        const canSee=(e)=>{
            if(!e||e.dead)return false;
            let d=dist(this.x,this.y,e.x,e.y);
            if(this.type === 'juju') return d < 1200;
            if(e.inBush&&!e.revealed&&d>200)return false;
            return hasLOS(this.x,this.y,e.x,e.y);
        };
        if(!this.target||this.target.dead||!canSee(this.target)) this.target=entities.find(e=>e!==this&&!e.dead&&canSee(e));
        if(this.target){
            let dAlvo=dist(this.x,this.y,this.target.x,this.target.y);
            let a=Math.atan2(this.target.y-this.y,this.target.x-this.x);
            if(this.type === 'juju') {
                if(dAlvo < 500) { this.moveDir = a + Math.PI + (Math.sin(Date.now()/200)*0.5); this.aiSpeed = this.speed; }
                else if(dAlvo > 700) { this.moveDir = a; this.aiSpeed = this.speed; }
                else { this.moveDir = a + Math.PI/2 * (Math.sin(Date.now()/300) > 0 ? 1 : -1); this.aiSpeed = this.speed * 0.7; }
                this.angle = a + (this.target.isPlayer && joyMove.active ? 0.15 : 0);
            } else {
                if(this.target.type === 'juju' && !hasLOS(this.x, this.y, this.target.x, this.target.y)) { this.moveDir = a + 1.2; this.aiSpeed = this.speed; }
                else { if(dAlvo<300){this.moveDir=a+Math.PI;this.aiSpeed=this.speed} else if(dAlvo>450){this.moveDir=a;this.aiSpeed=this.speed} else {this.aiSpeed=0} }
                this.angle = a;
            }
            if(this.ammo>0 && Math.random()<0.08) this.shoot(false, Math.min(1, dAlvo/650));
            if(this.superCharge>=100) this.shoot(true, 1.0);
        } else { if(this.decisionTimer<=0){this.decisionTimer=60;this.moveDir=Math.random()*Math.PI*2} this.aiSpeed=this.speed*0.5; this.angle = this.moveDir; }
    }
    shoot(isSuper, joyPowerInput = 1.0){
        if(isSuper) { if(this.superCharge < 100) return; this.superCharge = 0; } else { if(this.ammo <= 0) return; this.ammo--; }
        this.regenTimer=0; if(this.inBush){this.revealed=true;this.revealTimer=120}
        let totalDmg = this.dmg*(1+this.power*0.1); 
        if(this.type === 'juju' && isSuper) {
            entities.forEach(e => { if(e !== this) e.markedTimer = 60; });
            let distAim = 650 * joyPowerInput;
            let ax = this.x + Math.cos(this.angle) * distAim;
            let ay = this.y + Math.sin(this.angle) * distAim;
            bullets.push(new Bullet(ax, ay, 0, 0, 210, 9, this, false, false, false, true));
            return;
        }
        if(this.type === 'bull' && isSuper) { let sA = this.angle - 0.2; for(let i=0; i<5; i++) bullets.push(new Bullet(this.x, this.y, sA + (i*0.1), 20, 60, totalDmg*1.5, this, true)); return; }
        if(this.type === '8bit'){ 
            let s=0; let maxB = isSuper ? 16 : 7;
            let dmult = isSuper ? 1.5 : 1.0;
            let lockedAngle = this.angle;
            let it=setInterval(()=>{ 
                if(this.dead||s>=maxB){clearInterval(it);return} 
                bullets.push(new Bullet(this.x,this.y,lockedAngle+(Math.random()-0.5)*0.1,25,this.rangeMult,totalDmg*dmult,this));
                s++ 
            },60); 
            return; 
        }
        let count = this.bullets;
        let sA=this.angle-(this.spread/2), step=count>1?this.spread/(count-1):0;
        for(let i=0;i<count;i++) {
            if(this.isLobber) { let life = Math.max(10, Math.floor((650 / 15) * joyPowerInput)); bullets.push(new Bullet(this.x, this.y, sA+(step*i), 15, life, totalDmg, this, false, true)); 
            } else { bullets.push(new Bullet(this.x,this.y,sA+(step*i),25,this.rangeMult,totalDmg,this, false)); }
        }
    }
    takeDamage(d, attacker){
        this.hp-=d; this.regenTimer=0; if(!this.dead) particles.push(new Particle(this.x,this.y-50,Math.floor(d),"#ff1744"));
        if(attacker) { 
            let charge = (attacker.type === 'juju') ? 30 : 18;
            attacker.superCharge = Math.min(100, attacker.superCharge + charge); 
            if(!this.isPlayer){ this.target=attacker; this.decisionTimer=40; } 
        }
        if(this.hp<=0) this.die();
    }
    die(){
        if(this.dead)return; this.dead=true; survivors--; document.getElementById('ui-alive').innerText=survivors;
        for(let i=0;i<Math.max(1, Math.min(this.power, 3));i++) drops.push({x:this.x+(Math.random()-0.5)*80,y:this.y+(Math.random()-0.5)*80});
        if(this.isPlayer) setTimeout(()=>endGame(false),1500); else if(survivors===1&&!player.dead) endGame(true);
    }
    draw(){
        if(this.dead)return; 
        if(this.inBush&&!this.isPlayer&&!this.revealed&&dist(this.x,this.y,player.x,player.y)>220 && this.markedTimer <= 0) return;
        ctx.save(); ctx.translate(this.x,this.y);
        if(this.markedTimer > 0) { ctx.fillStyle = "#ffca28"; ctx.beginPath(); ctx.moveTo(0, -130); ctx.lineTo(-15, -150); ctx.lineTo(15, -150); ctx.fill(); }
        if(this.isPlayer && this.type === 'juju' && joyShoot.active) {
            let targetDist = 650 * joyShoot.power;
            let tx = Math.cos(this.angle) * targetDist; let ty = Math.sin(this.angle) * targetDist;
            ctx.fillStyle = "rgba(118, 255, 3, 0.2)"; ctx.strokeStyle = "#76ff03"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(tx, ty, 80, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        }
        if(this.isPlayer && this.type === 'juju' && joySuper.active && this.superCharge >= 100) {
            let targetDist = 650 * joySuper.power;
            let tx = Math.cos(this.angle) * targetDist; let ty = Math.sin(this.angle) * targetDist;
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(tx, ty, 250, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        }
        if(this.inBush)ctx.globalAlpha=0.5;
        ctx.fillStyle="#111"; ctx.fillRect(-60,-95,120,15);
        ctx.fillStyle=this.isPlayer?"#00e676":"#d50000"; ctx.fillRect(-60,-95,120*(Math.max(0,this.hp)/this.maxHp),15);
        ctx.fillStyle="#fff"; ctx.font="bold 12px Arial"; ctx.textAlign="center"; ctx.fillText(Math.floor(this.hp) + " / " + this.maxHp, 0, -83);
        ctx.fillStyle="#ff9100"; ctx.fillRect(-45,-78,30*this.ammo,5);
        ctx.fillStyle="#ffeb3b"; ctx.fillRect(-45,-71,90*(this.superCharge/100),5);
        if(this.power>0){ctx.fillStyle="#fff";ctx.font="bold 18px Arial";ctx.fillText("⚡"+this.power,-75,-83)}
        ctx.rotate(this.angle); ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(-15,-15,10,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-15,15,10,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=this.baseColor; ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill(); ctx.fillStyle="rgba(0,0,0,0.3)"; ctx.fillRect(-13,-20,26,40);
        ctx.fillStyle="#f5c6a5"; ctx.beginPath(); ctx.arc(15,-12,9,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(25,12,9,0,Math.PI*2); ctx.fill(); 
        ctx.fillStyle="#333"; ctx.fillRect(10,4,60,8); ctx.fillStyle="#5d4037"; ctx.fillRect(10,4,35,8); ctx.fillRect(0,4,10,14); ctx.fillStyle="#000"; ctx.fillRect(40,10,10,14);
        ctx.fillStyle=this.isPlayer?"#1565c0":"#c62828"; ctx.beginPath(); ctx.arc(0,0,19,0,Math.PI*2); ctx.fill(); ctx.restore(); ctx.globalAlpha=1;
    }
}

function hasLOS(x1,y1,x2,y2){ let d=dist(x1,y1,x2,y2), s=Math.ceil(d/40); for(let i=1;i<s;i++){ let tx=x1+(x2-x1)*(i/s), ty=y1+(y2-y1)*(i/s); if(checkWall(tx,ty)) return false; } return true; }
function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2)}
function checkWall(x,y){for(let w of walls)if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h)return true;return false}

function startGame(){
    document.querySelectorAll('.menu-screen').forEach(s=>s.style.display='none');document.getElementById('ui-layer').style.display='block';
    currentMap=MAPS[0]; walls=[]; bushes=[]; boxes=[]; spawns=[]; entities=[]; drops=[]; bullets=[]; particles=[];
    let grid=currentMap.grid; MAP_W=grid[0].length*TILE; MAP_H=grid.length*TILE; gasRadius=MAP_W * 0.8;
    for(let y=0;y<grid.length;y++)for(let x=0;x<grid[0].length;x++){
        let t=grid[y][x],px=x*TILE,py=y*TILE;
        let isBorder = (x===0 || y===0 || x===grid[0].length-1 || y===grid.length-1);
        if(t==='W')walls.push({x:px,y:py,w:TILE,h:TILE,isBorder:isBorder});
        if(t==='M')bushes.push({x:px,y:py,w:TILE,h:TILE});
        if(t==='C')boxes.push({x:px+TILE/2,y:py+TILE/2,hp:5000,dead:false});
        if(t==='S')spawns.push({x:px+TILE/2,y:py+TILE/2});
    }
    spawns.sort(()=>Math.random()-0.5); player=new Brawler(spawns[0].x,spawns[0].y,selectedBrawlerKey,true); entities.push(player);
    let types=['shelly','shelly2','colt','bull','8bit','juju']; for(let i=1;i<spawns.length&&i<=9;i++)entities.push(new Brawler(spawns[i].x,spawns[i].y,types[Math.floor(Math.random()*types.length)],false));
    survivors=entities.length; document.getElementById('ui-alive').innerText=survivors; gameActive=true; paused=false; loop();
}

function togglePause(){if(!gameActive)return;paused=!paused;document.getElementById('pauseMenu').style.display=paused?'flex':'none'}
function endGame(win){gameActive=false;document.getElementById('endScreen').style.display='flex';document.getElementById('endTitle').innerText=win?"VITÓRIA!":"DERROTA";document.getElementById('endSub').innerText=win?"DOMINAÇÃO TOTAL!":"Posição: #"+survivors}

function loop(){
    if(!gameActive)return; requestAnimationFrame(loop); if(paused)return; gasRadius-=0.8;
    entities.forEach(e=>e.update()); bullets.forEach((b,i)=>{b.update();if(b.life<=0)bullets.splice(i,1)}); particles.forEach((p,i)=>{p.update();if(p.life<=0)particles.splice(i,1)});
    cam.x=Math.max(0,Math.min(player.x-cvs.width/2,MAP_W-cvs.width));cam.y=Math.max(0,Math.min(player.y-cvs.height/2,MAP_H-cvs.height));
    ctx.fillStyle="#000";ctx.fillRect(0,0,cvs.width,cvs.height);ctx.save();ctx.translate(-cam.x,-cam.y);
    ctx.fillStyle=currentMap.color;ctx.fillRect(0,0,MAP_W,MAP_H);
    ctx.fillStyle=currentMap.bushColor;bushes.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
    drops.forEach(d=>{ctx.fillStyle="#00e5ff";ctx.fillRect(d.x-15,d.y-15,30,30)});
    boxes.forEach(b=>{if(b.dead)return;ctx.fillStyle="#ffb74d";ctx.fillRect(b.x-45,b.y-45,90,90);ctx.fillStyle="#000";ctx.fillRect(b.x-35,b.y-60,70,8);ctx.fillStyle="#0f0";ctx.fillRect(b.x-35,b.y-60,70*(b.hp/5000),8)});
    entities.sort((a,b)=>a.y-b.y).forEach(e=>e.draw()); bullets.forEach(b=>b.draw()); particles.forEach(p=>p.draw());
    walls.forEach(w=>{ ctx.fillStyle=w.isBorder?"#222":currentMap.wallColor; ctx.fillRect(w.x,w.y,w.w,w.h); if(w.isBorder){ctx.strokeStyle="#444";ctx.lineWidth=4;ctx.strokeRect(w.x,w.y,w.w,w.h)} });
    ctx.strokeStyle="rgba(0,255,0,0.3)";ctx.lineWidth=1500;ctx.beginPath();ctx.arc(MAP_W/2,MAP_H/2,gasRadius+750,0,Math.PI*2);ctx.stroke();ctx.restore();
}

function handleJoy(e,j,isP){
    if(paused)return; e.preventDefault();
    if(!isP){ if(j.active){ if(j.id === 'j-super') player.shoot(true, j.power); else if(j.id === 'j-shoot') player.shoot(false, j.power); } j.active=false;j.x=0;j.y=0;j.power=0;document.getElementById(j.stick).style.transform=`translate(-50%,-50%)`; return; }
    let t=e.targetTouches[0],r=e.currentTarget.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
    let distVal=Math.min(Math.hypot(dx,dy),50),ang=Math.atan2(dy,dx);
    j.active=true;j.x=Math.cos(ang);j.y=Math.sin(ang);j.power=distVal/50;
    document.getElementById(j.stick).style.transform=`translate(calc(-50% + ${Math.cos(ang)*distVal}px), calc(-50% + ${Math.sin(ang)*distVal}px))`;
}
[joyMove, joyShoot, joySuper].forEach(j=>{ let el=document.getElementById(j.id); el.addEventListener('touchstart',e=>handleJoy(e,j,true)); el.addEventListener('touchmove',e=>handleJoy(e,j,true)); el.addEventListener('touchend',e=>handleJoy(e,j,false)); });
initMenu();
</script>

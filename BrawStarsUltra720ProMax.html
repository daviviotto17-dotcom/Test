<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival.io. Old</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@700&display=swap');
        body { margin: 0; overflow: hidden; background: #0d0d0d; font-family: 'Roboto', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 5; }
        .hud-top { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; }
        .stat-box { background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 12px; border: 2px solid #555; color: #fff; font-family: 'Black Ops One', cursive; font-size: 28px; text-shadow: 2px 2px 0 #000; display: flex; align-items: center; gap: 10px; }
        .btn-pause { pointer-events: auto; background: #d32f2f; border: 3px solid #fff; width: 50px; height: 50px; border-radius: 50%; color: white; font-size: 22px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #b71c1c; }
        #super-notify { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); font-family: 'Black Ops One'; font-size: 40px; color: #ffeb3b; text-shadow: 0 0 10px #ffc107, 4px 4px 0 #000; display: none; animation: pulse 0.5s infinite alternate; pointer-events: none; }
        @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.2); } }
        .joy-zone { position: fixed; width: 140px; height: 140px; pointer-events: none; z-index: 100; transition: opacity 0.1s; opacity: 0; transform: translate(-50%, -50%); }
        #j-move { opacity: 0; } 
        #j-shoot { opacity: 0; }
        #j-super { bottom: 160px; right: 60px; width: 100px; height: 100px; opacity: 0.5; pointer-events: none; transition: 0.3s; position: absolute; }
        #j-super.super-ready { opacity: 1; pointer-events: auto; filter: drop-shadow(0 0 10px #ffeb3b); }
        .btn-gadget { position: absolute; bottom: 180px; right: 180px; width: 70px; height: 70px; background: #6eff95; border: 4px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; pointer-events: auto; box-shadow: 0 0 10px #000; z-index: 105; cursor: pointer; }
        .btn-gadget.disabled { opacity: 0.3; pointer-events: none; background: #555; }
        .joy-bg { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; }
        .joy-stick { width: 50%; height: 50%; background: rgba(255, 202, 40, 0.9); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #stick-move { background: #00e5ff; } #stick-shoot { background: #ff5252; } #stick-super { background: #ffeb3b; border: 2px solid #fff; }
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 1000; background: #111; color: white; }
        #homeScreen { background: #0f172a; align-items: center; justify-content: center; }
        .home-logo { position: absolute; top: 40px; left: 40px; font-family: 'Black Ops One'; color: #ffca28; font-size: 40px; text-transform: uppercase; }
        .home-char-display { transform: scale(3.5); margin-bottom: 50px; }
        .btn-battle { position: absolute; right: 20px; bottom: 20px; background: #43a047; color: white; font-family: 'Black Ops One'; font-size: 24px; padding: 15px 50px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-agents-home { position: absolute; left: 20px; bottom: 20px; width: 80px; height: 90px; background: #222; border: 2px solid #555; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-family: 'Black Ops One'; font-size: 12px; }
        #selectionScreen { background: linear-gradient(180deg, #1e88e5 0%, #0d47a1 100%); display: none; padding: 20px; box-sizing: border-box; }
        .agents-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px; margin: 0 auto; margin-top: 60px; }
        .agent-card { width: 130px; height: 160px; background: #81d4fa; border: 3px solid #000; border-radius: 8px; position: relative; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        .agent-name-tag { position: absolute; bottom: 35px; width: 100%; text-align: center; font-family: 'Black Ops One'; font-size: 16px; color: white; text-shadow: 2px 2px 0 #000; z-index: 2; }
        .power-level { position: absolute; bottom: 0; left: 0; width: 100%; height: 30px; background: #64dd17; border-top: 2px solid #000; display: flex; align-items: center; justify-content: center; font-family: 'Black Ops One'; font-size: 14px; color: #000; }
        #infoScreen { background: radial-gradient(circle at center, #42a5f5 0%, #1565c0 100%); display: none; }
        .info-content { display: flex; width: 100%; height: 100%; position: relative; }
        .info-left-text { position: absolute; top: 100px; left: 40px; width: 250px; z-index: 2; }
        .info-stats-box { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); width: 280px; background: rgba(0,0,0,0.6); border: 4px solid #000; border-radius: 10px; padding: 15px; }
        .stat-row { margin-bottom: 10px; color: white; font-family: 'Black Ops One'; }
        .btn-select-confirm { position: absolute; bottom: 30px; left: 40px; background: #ffca28; color: #000; font-family: 'Black Ops One'; font-size: 28px; padding: 15px 60px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-back { font-family: 'Black Ops One'; font-size: 30px; color: white; cursor: pointer; background:none; border:none; padding: 10px; position: absolute; top: 20px; left: 20px; z-index: 100; }
        #pauseMenu, #endScreen { display: none; position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        #endScreen h1 { color: #ffca28; font-family: 'Black Ops One'; font-size: 48px; }
        .legacy-btn { padding: 20px 60px; font-size: 28px; font-family: 'Black Ops One'; background: #43a047; border: none; color: white; border-radius: 10px; margin: 10px; }
    </style>
</head>
<body>

<div id="homeScreen" class="menu-screen">
    <div class="home-logo">SURVIVAL.IO<span style="font-size:20px; color:#fff; display:block">Battle Royale</span></div>
    <canvas id="homeCanvas" width="100" height="100" class="home-char-display"></canvas>
    <div class="btn-agents-home" onclick="goToSelection()"><div style="font-size:30px">👥</div>AGENTES</div>
    <button class="btn-battle" onclick="startGame()">BATALHAR</button>
</div>

<div id="selectionScreen" class="menu-screen">
    <button class="btn-back" onclick="goToHome()"> < </button>
    <div class="agents-grid" id="agentsGrid"></div>
</div>

<div id="infoScreen" class="menu-screen">
    <button class="btn-back" onclick="goToSelection()"> < </button>
    <div class="info-content">
        <!-- Título -->
        <h1 style="text-align:center; font-family:'Black Ops One'; font-size:48px; margin:20px 0; color:#fff; text-shadow: 0 4px 8px rgba(0,0,0,0.5);">ESTATÍSTICAS DO BRAWLER</h1>
        
        <!-- Container principal -->
        <div style="display:flex; gap:30px; padding:20px; max-width:1200px; margin:0 auto;">
            <!-- Coluna esquerda - Estatísticas básicas -->
            <div style="flex:1; background:rgba(13,71,161,0.8); border-radius:15px; padding:25px; border:3px solid #1976d2;">
                <!-- Saúde e Velocidade -->
                <div style="display:flex; gap:15px; margin-bottom:20px;">
                    <div style="flex:1; background:rgba(76,175,80,0.3); border-radius:10px; padding:15px; border:2px solid #4caf50;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="font-size:32px;">❤️</div>
                            <div>
                                <div style="font-size:12px; color:#aaa;">Saúde</div>
                                <div id="infoHp" style="font-size:24px; font-weight:bold; color:#fff;"></div>
                            </div>
                        </div>
                    </div>
                    <div style="flex:1; background:rgba(33,150,243,0.3); border-radius:10px; padding:15px; border:2px solid #2196f3;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="font-size:32px;">⚡</div>
                            <div>
                                <div style="font-size:12px; color:#aaa;">Velocidade de movimento</div>
                                <div id="infoSpeed" style="font-size:20px; font-weight:bold; color:#fff;"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Ataque -->
                <div style="background:rgba(244,67,54,0.3); border-radius:10px; padding:20px; margin-bottom:20px; border:2px solid #f44336;">
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                        <div style="font-size:32px;">💥</div>
                        <div style="font-size:24px; font-weight:bold; color:#f44336;">ATAQUE</div>
                    </div>
                    <div id="infoAttackName" style="font-size:18px; font-weight:bold; margin-bottom:10px; color:#fff;"></div>
                    <div id="infoAttackDesc" style="font-size:14px; color:#e3f2fd; margin-bottom:15px; line-height:1.5;"></div>
                    <div style="display:flex; gap:15px; flex-wrap:wrap;">
                        <div style="background:rgba(0,0,0,0.3); padding:10px 15px; border-radius:8px;">
                            <div style="font-size:11px; color:#aaa;">Dano</div>
                            <div id="infoDmg" style="font-size:18px; font-weight:bold; color:#fff;"></div>
                        </div>
                        <div style="background:rgba(0,0,0,0.3); padding:10px 15px; border-radius:8px;">
                            <div style="font-size:11px; color:#aaa;">Alcance</div>
                            <div id="infoRange" style="font-size:18px; font-weight:bold; color:#fff;"></div>
                        </div>
                        <div style="background:rgba(0,0,0,0.3); padding:10px 15px; border-radius:8px;">
                            <div style="font-size:11px; color:#aaa;">Velocidade de recarga</div>
                            <div id="infoReload" style="font-size:18px; font-weight:bold; color:#fff;"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Super -->
                <div style="background:rgba(255,235,59,0.3); border-radius:10px; padding:20px; border:2px solid #ffeb3b;">
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                        <div style="font-size:32px;">⭐</div>
                        <div style="font-size:24px; font-weight:bold; color:#ffeb3b;">SUPER</div>
                    </div>
                    <div id="infoSuperName" style="font-size:18px; font-weight:bold; margin-bottom:10px; color:#fff;"></div>
                    <div id="infoSuperDesc" style="font-size:14px; color:#e3f2fd; line-height:1.5;"></div>
                </div>
            </div>
            
            <!-- Coluna direita - Personagem e Gadget -->
            <div style="flex:1; display:flex; flex-direction:column; gap:20px;">
                <!-- Personagem grande -->
                <div style="background:rgba(13,71,161,0.8); border-radius:15px; padding:20px; border:3px solid #1976d2; text-align:center;">
                    <div id="infoName" style="font-family:'Black Ops One'; font-size:40px; margin-bottom:15px; color:#fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);"></div>
                    <div style="width:300px; height:300px; margin:0 auto; position:relative;">
                        <canvas id="infoCanvas" width="300" height="300" style="transform:scale(2.5);"></canvas>
                    </div>
                    <div id="infoDesc" style="font-size:16px; color:#e3f2fd; margin-top:15px; font-style:italic;"></div>
                </div>
                
                <!-- Gadget -->
                <div style="background:rgba(156,39,176,0.3); border-radius:10px; padding:20px; border:2px solid #9c27b0;">
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                        <div style="font-size:32px;">🔧</div>
                        <div style="font-size:24px; font-weight:bold; color:#ce93d8;">ACESSÓRIO</div>
                    </div>
                    <div id="infoGadgetDesc" style="font-size:14px; color:#e3f2fd; line-height:1.5;"></div>
                </div>
            </div>
        </div>
        
        <button class="btn-select-confirm" onclick="selectBrawler()" style="margin:20px auto; display:block;">SELECIONAR</button>
    </div>
</div>

<div id="pauseMenu"><h1>PAUSADO</h1><button class="legacy-btn" onclick="togglePause()" style="background:#1976d2">Retornar</button><button class="legacy-btn" onclick="location.reload()" style="background:#d32f2f">Sair</button></div>
<div id="endScreen"><h1 id="endTitle">FIM</h1><h2 id="endSub"></h2><button class="legacy-btn" onclick="location.reload()">Menu</button></div>

<div id="ui-layer">
    <div class="hud-top">
        <div class="stat-box" style="border-color:#00e5ff; color:#00e5ff;">⚡ <span id="ui-power" style="color:white">0</span></div>
        <div id="super-notify">SUPER!</div>
        <div class="btn-pause" onclick="togglePause()">||</div>
        <div class="stat-box" style="border-color:#ff5252; color:#ff5252;">💀 <span id="ui-alive" style="color:white">10</span></div>
    </div>
    
    <div id="btn-gadget" class="btn-gadget">⚙️</div>

    <div id="j-move" class="joy-zone"><div class="joy-bg"><div id="stick-move" class="joy-stick"></div></div></div>
    <div id="j-shoot" class="joy-zone"><div class="joy-bg"><div id="stick-shoot" class="joy-stick"></div></div></div>
    <div id="j-super" class="joy-zone"><div class="joy-bg" style="border-color:#ffeb3b"><div id="stick-super" class="joy-stick"></div></div></div>
</div>

<canvas id="cvs"></canvas>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
cvs.width = window.innerWidth;
cvs.height = window.innerHeight;

const BRAWLERS = {
    shelly: { 
        name: "SHELLY", hp: 4000, speed: 6.5, bullets: 5, spread: 0.35, range: 48, reload: 45, dmg: 340, color: "#f06292", 
        desc: "Rajada de chumbo grosso.", 
        superName: "SUPERBALA", 
        superDesc: "Rajada devastadora que quebra paredes",
        gadgetDesc: "Imunidade por 1s. 3 usos, recarrega a cada 2 supers"
    },
    edgar: { 
        name: "EDGAR", hp: 3800, speed: 8.2, bullets: 2, spread: 0.2, range: 7, reload: 15, dmg: 1600, color: "#212121", 
        desc: "Salto e socos.", 
        superName: "SALTO", 
        superDesc: "Salta, paralisa inimigos, ganha escudo 1000HP e velocidade",
        gadgetDesc: "Escudo 3330HP (10s) + velocidade. Recarrega em 20s"
    },
    piper: { 
        name: "PIPER", hp: 3200, speed: 7.5, bullets: 1, spread: 0, range: 140, reload: 35, dmg: 820, color: "#ff69b4", 
        desc: "Atiradora de longo alcance. Mais dano à distância!", 
        superName: "VOO + GRANADA", 
        superDesc: "Voa até o alvo e solta granada explosiva no ponto de partida!",
        gadgetDesc: "Próximo tiro: +1300 dano. Recarrega em 20s"
    }, 
    bull: { 
        name: "BULL", hp: 6000, speed: 5.1, bullets: 4, spread: 0.45, range: 20, reload: 67, dmg: 699, color: "#ffb74d", 
        desc: "Tanque agressivo.", 
        superName: "BULLDOZER", 
        superDesc: "Carga que quebra paredes e causa dano",
        gadgetDesc: "Próximo ataque paralisa 1.5s. Recarrega em 15s"
    },
    '8bit': { 
        name: "8-BIT", hp: 5200, speed: 4.8, bullets: 6, spread: 0.05, range: 108, reload: 144, dmg: 680, color: "#7e57c2", 
        desc: "Poderoso e lento. Super carrega 30% mais devagar.", 
        superName: "TORRETA EXPLOSIVA", 
        superDesc: "Torreta 3000HP que explode em 3s e solta 3 patos (200dmg cada, 3000HP, perdem 249HP/s)",
        gadgetDesc: "Paralisa patos existentes OU marca próximos 3 para paralisar. Cooldown 20s"
    },
    juju: { 
        name: "JUJU", hp: 3800, speed: 6.8, bullets: 1, spread: 0.0, range: 650, reload: 55, dmg: 1400, color: "#76ff03", 
        desc: "Magia de área. Super: Aura do Vazio.", 
        superName: "O VAZIO", 
        superDesc: "Zona que causa dano, veneno, reduz velocidade e puxa inimigos",
        gadgetDesc: "Próximo ataque: +30%dmg, +50%área, -35%vel, +10%reload inimigos, bloqueia super 4s, quebra paredes. 17s",
        isLobber: true 
    }
};

let selectedBrawlerKey = localStorage.getItem('myBrawler') || 'shelly';
let viewingBrawlerKey = selectedBrawlerKey;

function initMenu() { renderMenuChar('homeCanvas', selectedBrawlerKey); buildGrid(); }
function goToHome() { document.querySelectorAll('.menu-screen').forEach(s => s.style.display = 'none'); document.getElementById('homeScreen').style.display = 'flex'; renderMenuChar('homeCanvas', selectedBrawlerKey); }
function goToSelection() { document.querySelectorAll('.menu-screen').forEach(s => s.style.display = 'none'); document.getElementById('selectionScreen').style.display = 'flex'; }
function goToInfo(key) {
    viewingBrawlerKey = key; 
    document.querySelectorAll('.menu-screen').forEach(s => s.style.display = 'none'); 
    document.getElementById('infoScreen').style.display = 'flex';
    
    const b = BRAWLERS[key]; 
    
    // Nome e descrição
    document.getElementById('infoName').innerText = b.name; 
    document.getElementById('infoDesc').innerText = b.desc;
    
    // Estatísticas básicas
    document.getElementById('infoHp').innerText = b.hp;
    
    // Velocidade de movimento
    let speedText = "MUITO LENTA";
    if(b.speed >= 7.5) speedText = "RÁPIDA";
    else if(b.speed >= 6.5) speedText = "NORMAL";
    else if(b.speed >= 5.5) speedText = "LENTA";
    document.getElementById('infoSpeed').innerText = speedText;
    
    // Ataque
    document.getElementById('infoAttackName').innerText = b.name.toUpperCase();
    document.getElementById('infoAttackDesc').innerText = b.desc;
    document.getElementById('infoDmg').innerText = (b.bullets > 1) ? `${b.bullets} x ${b.dmg}` : b.dmg;
    
    // Alcance
    let rangeText = "MUITO LONGO";
    if(b.range <= 20) rangeText = "CURTO";
    else if(b.range <= 50) rangeText = "MÉDIO";
    else if(b.range <= 100) rangeText = "LONGO";
    document.getElementById('infoRange').innerText = rangeText;
    
    // Velocidade de recarga
    let reloadText = "MUITO LENTA";
    if(b.reload <= 30) reloadText = "MUITO RÁPIDA";
    else if(b.reload <= 50) reloadText = "RÁPIDA";
    else if(b.reload <= 70) reloadText = "NORMAL";
    else if(b.reload <= 100) reloadText = "LENTA";
    document.getElementById('infoReload').innerText = reloadText;
    
    // Super
    document.getElementById('infoSuperName').innerText = b.superName || "SUPER";
    document.getElementById('infoSuperDesc').innerText = b.superDesc || "Habilidade especial poderosa";
    
    // Gadget
    document.getElementById('infoGadgetDesc').innerText = b.gadgetDesc || "Acessório especial";
    
    renderMenuChar('infoCanvas', key);
}
function selectBrawler() { selectedBrawlerKey = viewingBrawlerKey; localStorage.setItem('myBrawler', selectedBrawlerKey); goToHome(); }

function buildGrid() {
    const grid = document.getElementById('agentsGrid'); grid.innerHTML = '';
    Object.keys(BRAWLERS).forEach(key => {
        const b = BRAWLERS[key]; const card = document.createElement('div'); card.className = 'agent-card'; card.style.background = b.color; card.onclick = () => goToInfo(key);
        const c = document.createElement('canvas'); c.width = 80; c.height = 80;
        const n = document.createElement('div'); n.className = 'agent-name-tag'; n.innerText = b.name;
        const bg = document.createElement('div'); bg.className = 'power-level'; bg.innerHTML = `<span>⚡ 1</span>`;
        card.appendChild(c); card.appendChild(n); card.appendChild(bg); grid.appendChild(card);
        setTimeout(() => renderMenuCharCtx(c.getContext('2d'), key, 40, 40), 10);
    });
}
function renderMenuChar(canvasId, key) { const c = document.getElementById(canvasId); renderMenuCharCtx(c.getContext('2d'), key, c.width/2, c.height/2); }
function renderMenuCharCtx(ctx, key, x, y) {
    const b = BRAWLERS[key]; ctx.clearRect(0,0,200,200); ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(-15, -15, 10, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-15, 15, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(-13, -20, 26, 40);
    ctx.fillStyle = "#f5c6a5"; ctx.beginPath(); ctx.arc(15, -12, 9, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(25, 12, 9, 0, Math.PI*2); ctx.fill(); 
    ctx.fillStyle = "#333"; ctx.fillRect(10, 4, 60, 8); ctx.fillStyle = "#5d4037"; ctx.fillRect(10, 4, 35, 8); ctx.fillRect(0, 4, 10, 14); ctx.fillStyle = "#000"; ctx.fillRect(40, 10, 10, 14);
    ctx.fillStyle = "#1565c0"; ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI*2); ctx.fill(); ctx.restore();
}

class Duck {
    constructor(x, y, owner, turret) {
        this.x = x;
        this.y = y;
        this.owner = owner;
        this.turret = turret;
        this.vx = 0;
        this.vy = 0;
        this.speed = 9;
        this.hp = 3000;
        this.maxHp = 3000;
        this.dead = false;
        this.dmg = 200;
        this.target = null;
        this.size = 25;
        this.attackCooldown = 0;
        this.paralyzeOnHit = false; // Flag para patos que paralisam (gadget do 8-bit)
    }
    update() {
        if(this.dead) return;
        
        if(this.attackCooldown > 0) this.attackCooldown--;
        
        // Perder 249 HP por segundo naturalmente (~4.15 HP por frame a 60fps)
        this.hp -= 4.15;
        if(this.hp <= 0) {
            this.dead = true;
            return;
        }
        
        // Procurar alvo mais próximo (VISÃO INFINITA)
        let closestDist = Infinity;
        this.target = null;
        for(let e of entities) {
            if(e !== this.owner && !e.dead) {
                let d = dist(this.x, this.y, e.x, e.y);
                if(d < closestDist) { // Sem limite de distância
                    closestDist = d;
                    this.target = e;
                }
            }
        }
        
        // Perseguir alvo com pathfinding básico
        if(this.target) {
            let angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            let nextX = this.x + Math.cos(angle) * this.speed;
            let nextY = this.y + Math.sin(angle) * this.speed;
            
            // Se tem parede no caminho, tentar contornar
            if(checkWall(nextX, nextY)) {
                // Tentar direções alternativas
                let bestAngle = angle;
                let bestDist = Infinity;
                
                for(let offset of [-Math.PI/4, Math.PI/4, -Math.PI/2, Math.PI/2]) {
                    let testAngle = angle + offset;
                    let testX = this.x + Math.cos(testAngle) * this.speed;
                    let testY = this.y + Math.sin(testAngle) * this.speed;
                    
                    if(!checkWall(testX, testY)) {
                        let distToTarget = dist(testX, testY, this.target.x, this.target.y);
                        if(distToTarget < bestDist) {
                            bestDist = distToTarget;
                            bestAngle = testAngle;
                        }
                    }
                }
                angle = bestAngle;
            }
            
            this.vx = Math.cos(angle) * this.speed;
            this.vy = Math.sin(angle) * this.speed;
            
            // Checar colisão com alvo
            if(dist(this.x, this.y, this.target.x, this.target.y) < 50 && this.attackCooldown <= 0) {
                // Aplicar dano
                this.target.takeDamage(this.dmg, this.owner, false); // false = não dá super
                
                // VENENO: 400 dano/s por 4 segundos
                this.target.poisonTimer = 240; // 4 segundos
                this.target.poisonDamage = 400;
                particles.push(new Particle(this.target.x, this.target.y - 70, "VENENO 400!", "#ff5252"));
                
                // CURA LENTA: 300 HP/s por 4 segundos DE CURA (APENAS se não estiver ativa)
                if(!this.target.slowHealActive) {
                    this.target.slowHealTimer = 240; // 4 segundos DE CURA efetiva (não conta se tomando dano)
                    this.target.slowHealActive = true;
                    particles.push(new Particle(this.target.x, this.target.y - 90, "CURA LENTA!", "#00ff00"));
                }
                
                // Se tem paralisia do gadget do 8-bit
                if(this.paralyzeOnHit) {
                    this.target.stunTimer = 60; // 1 segundo
                    particles.push(new Particle(this.target.x, this.target.y - 50, "PARALISIA!", "#ffeb3b"));
                }
                
                // Curar dono
                if(this.owner && !this.owner.dead) {
                    this.owner.hp = Math.min(this.owner.maxHp, this.owner.hp + 100);
                    particles.push(new Particle(this.owner.x, this.owner.y - 60, "+100 HP", "#00ff00"));
                }
                particles.push(new Particle(this.target.x, this.target.y - 30, "QUACK!", "#ffeb3b"));
                
                // PATO MORRE AO TOCAR (auto-destruição)
                this.dead = true;
                return;
            }
        } else {
            this.vx *= 0.95;
            this.vy *= 0.95;
        }
        
        // Movimento com evitar outros patos
        let finalVx = this.vx;
        let finalVy = this.vy;
        
        // Repulsão de outros patos (não grudar)
        for(let otherDuck of ducks) {
            if(otherDuck !== this && !otherDuck.dead) {
                let d = dist(this.x, this.y, otherDuck.x, otherDuck.y);
                if(d < 50) { // Muito perto
                    let pushAngle = Math.atan2(this.y - otherDuck.y, this.x - otherDuck.x);
                    finalVx += Math.cos(pushAngle) * 2;
                    finalVy += Math.sin(pushAngle) * 2;
                }
            }
        }
        
        if(!checkWall(this.x + finalVx, this.y)) this.x += finalVx;
        if(!checkWall(this.x, this.y + finalVy)) this.y += finalVy;
    }
    takeDamage(d, attacker, giveSuper = true) {
        this.hp -= d;
        particles.push(new Particle(this.x, this.y - 30, Math.floor(d), "#ff5252"));
        if(this.hp <= 0) this.dead = true;
    }
    draw() {
        if(this.dead) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Corpo do pato
        ctx.fillStyle = "#ffeb3b";
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Cabeça
        ctx.fillStyle = "#ffca28";
        ctx.beginPath();
        ctx.arc(-this.size * 0.4, -this.size * 0.3, this.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
        
        // Bico
        ctx.fillStyle = "#ff9800";
        ctx.beginPath();
        ctx.moveTo(-this.size * 0.7, -this.size * 0.3);
        ctx.lineTo(-this.size * 1.1, -this.size * 0.4);
        ctx.lineTo(-this.size * 1.1, -this.size * 0.2);
        ctx.fill();
        
        // Olho
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(-this.size * 0.5, -this.size * 0.4, 3, 0, Math.PI * 2);
        ctx.fill();
        
        // Barra de HP
        let barWidth = this.size * 2;
        let barHeight = 8;
        ctx.fillStyle = "#111";
        ctx.fillRect(-barWidth/2, -this.size - 25, barWidth, barHeight);
        ctx.fillStyle = "#0f0";
        ctx.fillRect(-barWidth/2, -this.size - 25, barWidth * (this.hp / this.maxHp), barHeight);
        
        // Mostrar HP numericamente
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 3;
        ctx.strokeText(Math.floor(this.hp), 0, -this.size - 30);
        ctx.fillText(Math.floor(this.hp), 0, -this.size - 30);
        
        ctx.restore();
    }
}

class Turret {
    constructor(x, y, owner) {
        this.x = x;
        this.y = y;
        this.owner = owner;
        this.hp = 1500;
        this.maxHp = 1500;
        this.dead = false;
        this.shootTimer = 0;
        this.shootInterval = 120; // 2 segundos
        this.size = 50;
    }
    update() {
        if(this.dead) return;
        
        // Torreta normal
        this.shootTimer++;
        if(this.shootTimer >= this.shootInterval) {
            this.shootTimer = 0;
            
            // Verificar se há algum inimigo próximo (800 de alcance)
            let hasNearbyEnemy = false;
            for(let e of entities) {
                if(e !== this.owner && !e.dead && dist(this.x, this.y, e.x, e.y) < 800) {
                    hasNearbyEnemy = true;
                    break;
                }
            }
            
            // Só soltar pato se tiver inimigo próximo
            if(hasNearbyEnemy) {
                let newDuck = new Duck(this.x, this.y, this.owner, this);
                
                // Verificar se owner tem gadget ativo (8-bit)
                if(this.owner && this.owner.eighbitDucksToParalyze > 0) {
                    newDuck.paralyzeOnHit = true;
                    this.owner.eighbitDucksToParalyze--;
                    particles.push(new Particle(this.x, this.y - 80, "PATO PARALISA!", "#ffeb3b"));
                    
                    if(this.owner.eighbitDucksToParalyze <= 0) {
                        this.owner.eighbitGadgetActive = false;
                    }
                }
                
                ducks.push(newDuck);
                particles.push(new Particle(this.x, this.y - 60, "QUACK!", "#ffeb3b"));
            }
        }
    }
    takeDamage(d) {
        this.hp -= d;
        particles.push(new Particle(this.x, this.y - 50, Math.floor(d), "#ff1744"));
        if(this.hp <= 0) this.dead = true;
    }
    draw() {
        if(this.dead) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Base da torreta
        ctx.fillStyle = "#7e57c2";
        ctx.fillRect(-this.size, -this.size * 0.5, this.size * 2, this.size);
        
        // Torre
        ctx.fillStyle = "#5e35b1";
        ctx.fillRect(-this.size * 0.6, -this.size * 1.2, this.size * 1.2, this.size);
        
        // Detalhe topo
        ctx.fillStyle = "#ffeb3b";
        ctx.fillRect(-this.size * 0.7, -this.size * 1.3, this.size * 1.4, this.size * 0.2);
        
        // Barra de HP
        ctx.fillStyle = "#111";
        ctx.fillRect(-this.size, -this.size - 25, this.size * 2, 12);
        ctx.fillStyle = "#00e676";
        ctx.fillRect(-this.size, -this.size - 25, (this.size * 2) * (this.hp / this.maxHp), 12);
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px Arial";
        ctx.textAlign = "center";
        ctx.fillText(Math.floor(this.hp) + "/" + this.maxHp, 0, -this.size - 16);
        
        ctx.restore();
    }
}

class Bullet {
    constructor(x,y,a,s,l,d,o, wallBuster=false, lobber=false, missile=false, isAura=false, stunDuration=0, giveSuper=true){
        this.x=x;this.y=y;this.angle = a; this.speed = s;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.life=l;this.maxLife=l;this.dmg=d;this.owner=o;
        this.wallBuster=wallBuster;this.isLobber=lobber;this.isMissile=missile;
        this.isAura = isAura;
        this.hitSomething = false;
        this.damageInterval = 20;
        this.lastDamageFrame = 0;
        this.stunDuration = stunDuration;
        this.giveSuper = giveSuper; // Se este bullet dá carga de super
    }
    update(){
        if(this.isAura) {
            this.life--;
            this.lastDamageFrame++;
            
            if(this.life <= 0) {
                // Quando a aura acaba, aplicar veneno em quem estava dentro
                if(this.isJujuAura) {
                    for(let e of entities) {
                        if(e !== this.owner && !e.dead && dist(this.x, this.y, e.x, e.y) < 250) {
                            e.poisonTimer = 300; // 5 segundos
                            e.poisonDamage = 100;
                            e.canUseSuper = true; // Liberar uso de super
                            e.slowness = 0; // Remover lentidão
                            particles.push(new Particle(e.x, e.y - 80, "ENVENENADO!", "#76ff03"));
                        }
                    }
                }
                return;
            }
            
            // Dano e efeitos contínuos para quem está dentro da aura da Juju
            if(this.isJujuAura && this.lastDamageFrame >= this.damageInterval) {
                this.lastDamageFrame = 0;
                for(let e of entities) {
                    if(e !== this.owner && !e.dead) {
                        let d = dist(this.x, this.y, e.x, e.y);
                        if(d < 250) {
                            // Dano
                            e.takeDamage(this.dmg, this.owner);
                            
                            // Lentidão 50%
                            e.slowness = 0.5;
                            
                            // Bloqueio de super
                            e.canUseSuper = false;
                            
                            // Aumentar tempo de reload em 10%
                            e.reloadTimer = Math.min(e.reloadTimer + 3, e.reloadTime * 1.1);
                            
                            // Atração suave para o centro
                            let angle = Math.atan2(this.y - e.y, this.x - e.x);
                            let pullForce = 2;
                            if(!checkWall(e.x + Math.cos(angle) * pullForce, e.y)) {
                                e.x += Math.cos(angle) * pullForce;
                            }
                            if(!checkWall(e.x, e.y + Math.sin(angle) * pullForce)) {
                                e.y += Math.sin(angle) * pullForce;
                            }
                        } else {
                            // Se saiu da aura, liberar
                            if(e.slowness > 0 && e.slowness <= 0.5) e.slowness = 0;
                            e.canUseSuper = true;
                        }
                    }
                }
            } else if(!this.isJujuAura && this.lastDamageFrame >= this.damageInterval) {
                // Aura normal (antiga)
                this.lastDamageFrame = 0;
                for(let e of entities) {
                    if(e !== this.owner && !e.dead && dist(this.x, this.y, e.x, e.y) < 250) {
                        e.takeDamage(this.dmg, this.owner);
                    }
                }
            }
            return;
        }
        this.x+=this.vx;this.y+=this.vy;this.life--;
        if(checkWall(this.x,this.y)){ 
            if(this.wallBuster) { this.explode(); this.life = 0; return; }
            if(!this.isLobber) { this.life=0; return; }
        }
        if(this.isLobber) { if(this.life <= 0) { this.explode(); return; } return; }
        for(let b of boxes){if(!b.dead && dist(this.x,this.y,b.x,b.y)<60){
            b.hp-=this.dmg; 
            if(b.hp <= 0) { b.dead=true; drops.push({x:b.x,y:b.y}); } 
            if(!this.wallBuster) { this.life=0; this.hitSomething=true; return; }
        }}
        for(let e of entities){if(e!==this.owner && !e.dead && dist(this.x,this.y,e.x,e.y)<45){
            // Calcular dano baseado na distância (para Piper)
            let finalDmg = this.dmg;
            if(this.owner && this.owner.type === 'piper') {
                // Distância percorrida = maxLife - life
                let distTraveled = this.maxLife - this.life;
                let distPercent = Math.min(1, distTraveled / this.maxLife);
                // Dano mínimo 820, máximo 3400
                finalDmg = 820 + (3400 - 820) * distPercent;
            }
            
            e.takeDamage(finalDmg,this.owner, this.giveSuper);
            if(this.stunDuration > 0) {
                e.stunTimer = this.stunDuration;
                particles.push(new Particle(e.x, e.y - 70, "STUNNED!", "#ffeb3b"));
            }
            this.hitSomething=true;
            if(!this.wallBuster) { this.life=0; return; }
        }}
    }
    explode() {
        particles.push(new Particle(this.x,this.y,"BUM!","#76ff03"));
        if(this.wallBuster) {
            for(let i=walls.length-1; i>=0; i--) {
                let w = walls[i]; if(!w.isBorder && dist(this.x,this.y, w.x+TILE/2, w.y+TILE/2) < 160) walls.splice(i, 1);
            }
        }
        let radius = (this.owner.type === 'juju') ? 160 : 130;
        for(let b of boxes){if(!b.dead && dist(this.x,this.y,b.x,b.y)<radius){b.hp-=this.dmg;if(b.hp<=0){b.dead=true;drops.push({x:b.x,y:b.y})}}}
        for(let e of entities){if(e!==this.owner && !e.dead && dist(this.x,this.y,e.x,e.y)<radius-20) e.takeDamage(this.dmg,this.owner, this.giveSuper);}
    }
    draw(){ 
        if(this.isAura) {
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.arc(this.x, this.y, 250, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#444"; ctx.lineWidth = 5; ctx.stroke();
            return;
        }
        if(this.isLobber) {
            let progress = 1 - (this.life / this.maxLife);
            let height = Math.sin(progress * Math.PI) * 140;
            ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(this.x, this.y, 14, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#76ff03"; ctx.strokeStyle = "#1b5e20"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(this.x, this.y - height, 16 + (height/7), 0, Math.PI*2); ctx.fill(); ctx.stroke();
        } else {
            ctx.fillStyle=this.wallBuster?"#ffa000":"#ffff00"; ctx.beginPath(); ctx.arc(this.x,this.y,this.wallBuster?15:8,0,Math.PI*2); ctx.fill(); 
        }
    }
}

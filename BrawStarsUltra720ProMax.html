<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Elite: Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@700&display=swap');
        
        body { margin: 0; overflow: hidden; background: #0d0d0d; font-family: 'Roboto', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }

        /* UI LAYER */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        
        .hud-top { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; }
        .stat-box { 
            background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 12px; border: 2px solid #555; 
            color: #fff; font-family: 'Black Ops One', cursive; font-size: 28px; 
            text-shadow: 2px 2px 0 #000; display: flex; align-items: center; gap: 10px; 
        }
        
        .btn-pause { pointer-events: auto; background: #d32f2f; border: 3px solid #fff; width: 50px; height: 50px; border-radius: 50%; color: white; font-size: 22px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #b71c1c; }
        .btn-pause:active { transform: translateY(4px); box-shadow: none; }

        /* SCREENS */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; pointer-events: auto; }
        
        h1 { font-family: 'Black Ops One'; font-size: 48px; color: #ffca28; text-transform: uppercase; margin-bottom: 0px; text-shadow: 0 5px 15px rgba(0,0,0,0.5); text-align: center; }
        
        .brawler-select { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; }
        .card { 
            background: rgba(255,255,255,0.05); border: 3px solid #555; width: 110px; padding: 20px; 
            border-radius: 15px; cursor: pointer; text-align: center; transition: 0.3s;
        }
        .card:hover, .card.selected { border-color: #ffca28; background: rgba(255,202,40,0.15); transform: scale(1.1); box-shadow: 0 0 20px rgba(255,202,40,0.3); }
        .card h3 { margin: 0 0 10px 0; font-family: 'Black Ops One'; font-size: 20px; }
        .card p { margin: 0; font-size: 13px; color: #ccc; font-weight: bold; }
        
        .btn-action { padding: 20px 60px; font-size: 28px; font-family: 'Black Ops One'; background: #43a047; border: none; color: white; border-radius: 10px; cursor: pointer; box-shadow: 0 8px 0 #1b5e20; text-transform: uppercase; letter-spacing: 1px; }
        .btn-action:active { transform: translateY(8px); box-shadow: none; }

        /* JOYSTICKS */
        .joy-zone { position: absolute; bottom: 50px; width: 160px; height: 160px; pointer-events: auto; z-index: 100; }
        #j-move { left: 40px; } #j-shoot { right: 40px; }
        .joy-bg { width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; top: 20px; left: 20px; }
        .joy-stick { width: 60px; height: 60px; background: rgba(255, 202, 40, 0.9); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(0,0,0,0.5); }

        #pauseMenu { background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: none; }
    </style>
</head>
<body>

<div id="startScreen" class="screen">
    <h1>Survival.io</h1>
    <h2 style="color: #ffca28; font-family: 'Black Ops One'; margin-bottom:0px; font-size:24px;">Battle royale</h2>
    <div style="color:#aaa; margin-bottom:15px; font-size:18px;">ESCOLHA SEU AGENTE</div>
    <div class="brawler-select">
        <div class="card selected" onclick="selectBrawler('shelly', this)" style="border-color:#f06292">
            <h3 style="color:#f06292">SHELLY</h3>
            <p>Vida: 4000</p>
            <p>Dano: 340</p>
            <p>Escopeta</p>
            <p>Alcance: Médio</p>
        </div>
        <div class="card" onclick="selectBrawler('colt', this)" style="border-color:#4dd0e1">
            <h3 style="color:#4dd0e1">COLT</h3>
            <p>Vida: 3200</p>
            <p>Dano: 850</p>
            <p>Sniper</p>
            <p>Alcance: Super longo</p>
        </div>
        <div class="card" onclick="selectBrawler('bull', this)" style="border-color:#ffb74d">
            <h3 style="color:#ffb74d">BULL</h3>
            <p>Vida: 4000</p>
            <p>Dano: 400</p>
            <p>Escopeta</p>
            <p>Alcance: Curto</p>
        </div>
    </div>
    <button class="btn-action" onclick="startGame()">Batalhar</button>
</div>

<div id="pauseMenu" class="screen">
    <h1>PAUSADO</h1>
    <button class="btn-action" onclick="togglePause()" style="background:#1976d2; margin-bottom:20px;">Retornar</button>
    <button class="btn-action" onclick="location.reload()" style="background:#d32f2f;">Sair</button>
</div>

<div id="endScreen" class="screen" style="display:none;">
    <h1 id="endTitle">FIM</h1>
    <h2 id="endSub" style="color:white; font-family:sans-serif; margin-bottom:30px; font-size: 24px;"></h2>
    <button class="btn-action" onclick="location.reload()">Menu</button>
</div>

<div id="ui-layer">
    <div class="hud-top">
        <div class="stat-box" style="border-color:#00e5ff; color:#00e5ff;">⚡ <span id="ui-power" style="color:white">0</span></div>
        <div class="btn-pause" onclick="togglePause()">||</div>
        <div class="stat-box" style="border-color:#ff5252; color:#ff5252;">💀 <span id="ui-alive" style="color:white">10</span></div>
    </div>
    <div id="j-move" class="joy-zone"><div class="joy-bg"><div id="stick-move" class="joy-stick"></div></div></div>
    <div id="j-shoot" class="joy-zone"><div class="joy-bg"><div id="stick-shoot" class="joy-stick" style="background:rgba(255,82,82,0.9)"></div></div></div>
</div>

<canvas id="cvs"></canvas>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
cvs.width = window.innerWidth;
cvs.height = window.innerHeight;

// --- CONFIGURAÇÃO ---
const BRAWLERS = {
    shelly: { hp: 4000, speed: 6.5, bullets: 5, spread: 0.35, range: 40, reload: 45, dmg: 340, color: "#f06292" },
    colt:   { hp: 3200, speed: 7.5, bullets: 1, spread: 0.02, range: 75, reload: 25, dmg: 850, color: "#4dd0e1" }, // Alcance aumentado
    bull:   { hp: 6000, speed: 7.0, bullets: 5, spread: 0.45, range: 25, reload: 50, dmg: 400, color: "#ffb74d" }
};

// --- CONTROLES PC ---
const keys = {};
let mousePos = {x: 0, y: 0};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousemove', e => {
    mousePos.x = e.clientX;
    mousePos.y = e.clientY;
});
window.addEventListener('mousedown', e => {
    if(gameActive && !paused && e.button === 0) player.shoot();
});

const MAPS = [
    {   color: "#795548", wallColor: "#4e342e", bushColor: "#8d6e63",
        grid: [
            "WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW",
            "WS...C...W.......C.......W...C.......SW",
            "W.........W...MMMMMMM...W.............W",
            "W...MM....C...MMMMMMM...C....MM.......W",
            "W...MM.......................MM.......W",
            "W.........WWC..........WW.............W",
            "W...C.....WW......C....WW.............W",
            "W.....................................W",
            "W...C..........WW.WW..........C.......W",
            "W..............W...W..................W",
            "W.....C........W...W..................W",
            "W..............W...W..................W",
            "W...WWWW.......W...W.......WWWW.......W",
            "W...W..........W...W..........W.......W",
            "W...W...C......MMMMM......C...W.......W",
            "W...W............C............W.......W",
            "W...W.........................W.......W",
            "W.............WMMMMMW.................W",
            "W............CWMMMMMW...........C.....W",
            "W.....C.......WMMMMMW.................W",
            "W............CWMMMMMWC................W",
            "W.............WMMMMMW.................W",
            "W...W.........................W.......W",
            "W...W.........................W.......W",
            "W...W...C......MMMMM......C...W.......W",
            "W...W..........W...W..........W.......W",
            "W...WWWW.......W...W.......WWWW.......W",
            "WS............CW.S.WC.................SW",
            "W..............W...W..................W",
            "W..............W...W..................W",
            "W...C..........WW.WW..........C.......W",
            "W.....................................W",
            "W.........WW...........WW.............W",
            "W.........WW...........WW.............W",
            "W...MM....C.............C....MM.......W",
            "W...MM........MMMMMMM........MM.......W",
            "W.........W...MMMMMMM...W.............W",
            "WS...C...W...............W...C.......SW",
            "WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW",
            "WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW"
        ]
    }
];

const TILE = 120;
let walls=[], bushes=[], boxes=[], spawns=[];
let MAP_W, MAP_H;
let selectedBrawler = 'shelly';

let gameActive = false, paused = false;
let entities = [], bullets = [], particles = [], drops = [];
let player = null;
let cam = {x:0, y:0};
let survivors = 0, gasRadius = 0;
let currentMap = null;

const joyMove = {x:0, y:0, active:false, id:'j-move', stick:'stick-move'};
const joyShoot = {x:0, y:0, active:false, id:'j-shoot', stick:'stick-shoot'};

class Particle {
    constructor(x, y, text, color) {
        this.x = x; this.y = y; this.text = text; this.color = color;
        this.life = 50; this.vy = -2;
    }
    update() { this.y += this.vy; this.life--; }
    draw() {
        ctx.globalAlpha = this.life/50;
        ctx.fillStyle = this.color; ctx.font = "bold 28px 'Black Ops One'";
        ctx.strokeStyle="black"; ctx.lineWidth=4;
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

class Bullet {
    constructor(x, y, angle, speed, life, dmg, owner) {
        this.x = x; this.y = y;
        this.vx = Math.cos(angle)*speed; this.vy = Math.sin(angle)*speed;
        this.life = life; this.dmg = dmg; this.owner = owner;
    }
    update() {
        this.x += this.vx; this.y += this.vy; this.life--;
        if(checkWall(this.x, this.y)) { this.life = 0; return; }
        for(let b of boxes) {
            if(!b.dead && dist(this.x, this.y, b.x, b.y) < 60) {
                b.hp -= this.dmg;
                particles.push(new Particle(b.x, b.y-50, Math.floor(this.dmg), "#fff"));
                if(b.hp <= 0) { b.dead = true; drops.push({x:b.x, y:b.y}); }
                this.life = 0; return;
            }
        }
        for(let e of entities) {
            if(e !== this.owner && !e.dead && dist(this.x, this.y, e.x, e.y) < 45) {
                e.takeDamage(this.dmg, this.owner);
                this.life = 0; return;
            }
        }
    }
    draw() {
        ctx.fillStyle = "#ffff00"; ctx.beginPath(); ctx.arc(this.x, this.y, 8, 0, Math.PI*2); ctx.fill();
    }
}

class Brawler {
    constructor(x, y, type, isPlayer) {
        this.x = x; this.y = y; this.isPlayer = isPlayer;
        this.type = type;
        const s = BRAWLERS[type];
        this.maxHp = isPlayer ? s.hp : Math.floor(s.hp * 1.3);
        this.hp = this.maxHp;
        this.speed = s.speed; 
        this.dmg = isPlayer ? s.dmg : Math.floor(s.dmg * 1.2);
        this.reloadTime = s.reload;
        this.bullets = s.bullets; this.spread = s.spread;
        this.rangeMult = s.range;
        this.baseColor = s.color;
        this.angle = 0; this.power = 0;
        this.ammo = 3; this.reloadTimer = 0;
        this.dead = false; this.inBush = false;
        this.revealed = false;
        this.revealTimer = 0;
        this.regenTimer = 0;
        this.target = null; this.decisionTimer = 0; this.moveDir = 0; this.aiSpeed = 0;
    }

    update() {
        if(this.dead) return;
        if(this.ammo < 3) {
            this.reloadTimer++;
            if(this.reloadTimer > Math.max(20, this.reloadTime - this.power*2)) { 
                this.ammo++; this.reloadTimer = 0; 
            }
        }
        if(this.revealed) {
            this.revealTimer--;
            if(this.revealTimer <= 0) this.revealed = false;
        }
        this.regenTimer++;
        if(this.regenTimer > 120) {
            this.hp = Math.min(this.maxHp, this.hp + (this.inBush ? 60 : 30));
        }

        let mx = 0, my = 0;
        if(this.isPlayer) {
            // Teclado PC
            if(keys['KeyW'] || keys['ArrowUp']) my = -this.speed;
            if(keys['KeyS'] || keys['ArrowDown']) my = this.speed;
            if(keys['KeyA'] || keys['ArrowLeft']) mx = -this.speed;
            if(keys['KeyD'] || keys['ArrowRight']) mx = this.speed;

            // Joystick Mobile (Prioridade)
            if(joyMove.active) {
                mx = joyMove.x * this.speed; 
                my = joyMove.y * this.speed;
            }

            // Mira (Mouse ou Joystick)
            if(joyShoot.active) {
                this.angle = Math.atan2(joyShoot.y, joyShoot.x);
            } else if (!joyMove.active) {
                // Mira no mouse em relação ao player no canvas
                this.angle = Math.atan2(mousePos.y - (this.y - cam.y), mousePos.x - (this.x - cam.x));
            } else if (mx !== 0 || my !== 0) {
                this.angle = Math.atan2(my, mx);
            }

        } else {
            this.runAI();
            mx = Math.cos(this.moveDir) * this.aiSpeed;
            my = Math.sin(this.moveDir) * this.aiSpeed;
        }

        if(!checkWall(this.x + mx, this.y)) this.x += mx;
        if(!checkWall(this.x, this.y + my)) this.y += my;

        this.inBush = false;
        for(let b of bushes) {
            if(this.x > b.x && this.x < b.x+TILE && this.y > b.y && this.y < b.y+TILE) {
                this.inBush = true; break;
            }
        }

        for(let i=drops.length-1; i>=0; i--) {
            if(dist(this.x, this.y, drops[i].x, drops[i].y) < 60) {
                this.power++; this.hp = Math.min(this.hp + 400, this.maxHp + 400); this.maxHp += 400;
                particles.push(new Particle(this.x, this.y-70, "POWER UP!", "#00e676"));
                drops.splice(i,1);
                if(this.isPlayer) document.getElementById('ui-power').innerText = this.power;
            }
        }
        if(dist(this.x, this.y, MAP_W/2, MAP_H/2) > gasRadius) this.takeDamage(20, null);
    }

    runAI() {
        this.decisionTimer--;
        const canSee = (ent) => {
            if (!ent || ent.dead) return false;
            let d = dist(this.x, this.y, ent.x, ent.y);
            if (ent.inBush && !ent.revealed && d > 200) return false;
            return true;
        };

        // IA agora tem um campo de busca maior (1200)
        if(!this.target || this.target.dead || !canSee(this.target)) {
            this.target = entities.find(e => e !== this && !e.dead && canSee(e) && dist(this.x, this.y, e.x, e.y) < 1200);
            if(!this.target) this.target = boxes.find(b => !b.dead && dist(this.x, this.y, b.x, b.y) < 800 && hasLOS(this.x, this.y, b.x, b.y));
        }

        if(this.target) {
            let d = dist(this.x, this.y, this.target.x, this.target.y);
            let a = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            
            if(hasLOS(this.x, this.y, this.target.x, this.target.y)) {
                this.angle = a;
                // Atira de longe se tiver munição
                let ideal = (this.type === 'bull') ? 120 : (this.type === 'colt' ? 600 : 300);
                
                if(d > ideal) {
                    this.moveDir = a; this.aiSpeed = this.speed;
                } else {
                    this.aiSpeed = this.speed * 0.3; // Anda devagar enquanto atira
                    if(this.ammo > 0 && Math.random() < 0.1) this.shoot();
                }
            } else {
                this.aiSpeed = this.speed;
                if(this.decisionTimer <= 0) {
                    this.decisionTimer = 30;
                    this.moveDir = a + (Math.random() > 0.5 ? 1.1 : -1.1);
                }
                this.angle = this.moveDir;
            }
        } else {
            if(this.decisionTimer <= 0) {
                this.decisionTimer = 60;
                this.moveDir = Math.random() * Math.PI * 2;
            }
            this.aiSpeed = this.speed * 0.5;
            this.angle = this.moveDir;
        }
    }

    shoot() {
        if(this.ammo <= 0) return;
        this.ammo--;
        this.regenTimer = 0;
        if(this.inBush) { this.revealed = true; this.revealTimer = 120; }
        let startAngle = this.angle - (this.spread/2);
        let step = this.bullets > 1 ? this.spread / (this.bullets-1) : 0;
        let totalDmg = this.dmg * (1 + this.power * 0.1);
        for(let i=0; i<this.bullets; i++) {
            let a = startAngle + (step*i);
            bullets.push(new Bullet(this.x, this.y, a, 25, this.rangeMult, totalDmg, this));
        }
    }

    takeDamage(d, attacker) {
        this.hp -= d; this.regenTimer = 0;
        particles.push(new Particle(this.x, this.y-50, Math.floor(d), "#ff1744"));
        if(attacker && !this.isPlayer) { this.target = attacker; this.decisionTimer = 40; }
        if(this.hp <= 0) this.die();
    }

    die() {
        if(this.dead) return;
        this.dead = true; survivors--;
        document.getElementById('ui-alive').innerText = survivors;
        let cubes = Math.floor(this.power/2) + 2; 
        for(let i=0; i<cubes; i++) drops.push({x:this.x+(Math.random()-0.5)*60, y:this.y+(Math.random()-0.5)*60});
        if(this.isPlayer) setTimeout(() => endGame(false), 1500);
        else if(survivors === 1 && !player.dead) endGame(true);
    }

    draw() {
        if(this.dead) return;
        if(this.inBush && !this.isPlayer && !this.revealed && dist(this.x, this.y, player.x, player.y) > 220) return;
        ctx.save(); ctx.translate(this.x, this.y);
        if(this.inBush) ctx.globalAlpha = 0.5;
        ctx.fillStyle = "#111"; ctx.fillRect(-45, -85, 90, 14);
        ctx.fillStyle = this.isPlayer ? "#00e676" : "#d50000";
        ctx.fillRect(-45, -85, 90 * (Math.max(0,this.hp)/this.maxHp), 14);
        ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(`${Math.floor(this.hp)}/${this.maxHp}`, 0, -74);
        ctx.fillStyle = "#ff9100"; ctx.fillRect(-45, -68, 30 * this.ammo, 6);
        if(this.power>0) { ctx.fillStyle = "#fff"; ctx.font="bold 18px Arial"; ctx.fillText("⚡"+this.power, -60, -75); }
        ctx.rotate(this.angle);
        ctx.fillStyle = "#111";
        ctx.beginPath(); ctx.arc(-15, -15, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(-15, 15, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = this.baseColor;
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(-13, -20, 26, 40);
        ctx.fillStyle = "#f5c6a5";
        ctx.beginPath(); ctx.arc(15, -12, 9, 0, Math.PI*2); ctx.fill(); 
        ctx.beginPath(); ctx.arc(25, 12, 9, 0, Math.PI*2); ctx.fill(); 
        ctx.fillStyle = "#333"; ctx.fillRect(10, 4, 60, 8);
        ctx.fillStyle = "#5d4037"; ctx.fillRect(10, 4, 35, 8); 
        ctx.fillRect(0, 4, 10, 14);
        ctx.fillStyle = "#000"; ctx.fillRect(40, 10, 10, 14);
        ctx.fillStyle = this.isPlayer ? "#1565c0" : "#c62828";
        ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
    }
}

function hasLOS(x1, y1, x2, y2) {
    let d = dist(x1, y1, x2, y2);
    let steps = d / 30;
    for(let i=0; i<steps; i++) {
        let tx = x1 + (x2-x1) * (i/steps);
        let ty = y1 + (y2-y1) * (i/steps);
        if(checkWall(tx, ty)) return false;
    }
    return true;
}

function dist(x1,y1,x2,y2) { return Math.hypot(x1-x2, y1-y2); }
function checkWall(x,y) {
    for(let w of walls) if(x>w.x && x<w.x+w.w && y>w.y && y<w.y+w.h) return true;
    return false;
}

function selectBrawler(type, el) {
    selectedBrawler = type;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
}

function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'block';
    currentMap = MAPS[0];
    walls=[]; bushes=[]; boxes=[]; spawns=[]; entities=[]; drops=[]; bullets=[]; particles=[];
    let grid = currentMap.grid;
    MAP_W = grid[0].length * TILE; MAP_H = grid.length * TILE;
    gasRadius = Math.max(MAP_W, MAP_H);
    for(let y=0; y<grid.length; y++) {
        for(let x=0; x<grid[0].length; x++) {
            let t = grid[y][x];
            let px = x*TILE, py = y*TILE;
            if(t==='W') walls.push({x:px, y:py, w:TILE, h:TILE});
            if(t==='M') bushes.push({x:px, y:py, w:TILE, h:TILE});
            if(t==='C') boxes.push({x:px+TILE/2, y:py+TILE/2, hp:5000, dead:false});
            if(t==='S') spawns.push({x:px+TILE/2, y:py+TILE/2});
        }
    }
    spawns.sort(() => Math.random()-0.5);
    player = new Brawler(spawns[0].x, spawns[0].y, selectedBrawler, true);
    entities.push(player);
    let types = ['shelly', 'colt', 'bull'];
    for(let i=1; i<spawns.length && i<=9; i++) {
        let type = types[Math.floor(Math.random()*types.length)];
        entities.push(new Brawler(spawns[i].x, spawns[i].y, type, false));
    }
    survivors = entities.length;
    document.getElementById('ui-alive').innerText = survivors;
    gameActive = true; paused = false;
    loop();
}

function togglePause() {
    if(!gameActive) return;
    paused = !paused;
    document.getElementById('pauseMenu').style.display = paused ? 'flex' : 'none';
}

function endGame(win) {
    gameActive = false;
    document.getElementById('endScreen').style.display = 'flex';
    document.getElementById('endTitle').innerText = win ? "VITÓRIA!" : "DERROTA";
    document.getElementById('endSub').innerText = win ? "DOMINAÇÃO TOTAL!" : "Posição: #" + survivors;
}

function loop() {
    if(!gameActive) return;
    requestAnimationFrame(loop);
    if(paused) return;
    gasRadius -= 0.3;
    entities.forEach(e => e.update());
    bullets.forEach((b,i) => { b.update(); if(b.life<=0) bullets.splice(i,1); });
    particles.forEach((p,i) => { p.update(); if(p.life<=0) particles.splice(i,1); });
    cam.x = player.x - cvs.width/2;
    cam.y = player.y - cvs.height/2;
    cam.x = Math.max(0, Math.min(cam.x, MAP_W - cvs.width));
    cam.y = Math.max(0, Math.min(cam.y, MAP_H - cvs.height));
    ctx.fillStyle = "#000"; ctx.fillRect(0,0,cvs.width,cvs.height);
    ctx.save(); ctx.translate(-cam.x, -cam.y);
    ctx.fillStyle = currentMap.color; ctx.fillRect(0,0,MAP_W, MAP_H);
    ctx.fillStyle = currentMap.bushColor; bushes.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
    drops.forEach(d => { ctx.fillStyle = "#00e5ff"; ctx.fillRect(d.x-15, d.y-15, 30, 30); });
    boxes.forEach(b => {
        if(b.dead) return;
        ctx.fillStyle = "#ffb74d"; ctx.fillRect(b.x-45, b.y-45, 90, 90);
        ctx.fillStyle="#000"; ctx.fillRect(b.x-35, b.y-60, 70, 8);
        ctx.fillStyle="#0f0"; ctx.fillRect(b.x-35, b.y-60, 70*(b.hp/5000), 8);
    });
    entities.sort((a,b) => a.y - b.y);
    entities.forEach(e => e.draw());
    bullets.forEach(b => b.draw());
    particles.forEach(p => p.draw());
    ctx.fillStyle = currentMap.wallColor;
    walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));
    ctx.strokeStyle = "rgba(0,255,0,0.3)"; ctx.lineWidth = 1500;
    ctx.beginPath(); ctx.arc(MAP_W/2, MAP_H/2, gasRadius + 750, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
}

function handleJoy(e, joy, isPress) {
    if(paused) return;
    e.preventDefault();
    if(!isPress) {
        if(joy.id === 'j-shoot' && joy.active) player.shoot();
        joy.active = false; joy.x=0; joy.y=0;
        document.getElementById(joy.stick).style.transform = `translate(-50%,-50%)`;
        return;
    }
    let touch = e.targetTouches[0];
    let rect = e.currentTarget.getBoundingClientRect();
    let dx = touch.clientX - (rect.left + rect.width/2);
    let dy = touch.clientY - (rect.top + rect.height/2);
    let d = Math.min(Math.hypot(dx, dy), 60);
    let ang = Math.atan2(dy, dx);
    joy.active = true;
    joy.x = Math.cos(ang) * (d/60);
    joy.y = Math.sin(ang) * (d/60);
    document.getElementById(joy.stick).style.transform = `translate(calc(-50% + ${Math.cos(ang)*d}px), calc(-50% + ${Math.sin(ang)*d}px))`;
}

[joyMove, joyShoot].forEach(j => {
    let el = document.getElementById(j.id);
    el.addEventListener('touchstart', e => handleJoy(e, j, true));
    el.addEventListener('touchmove', e => handleJoy(e, j, true));
    el.addEventListener('touchend', e => handleJoy(e, j, false));
});
</script>
